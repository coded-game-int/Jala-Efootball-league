<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JALALA Zone – Live Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4af37;--gold2:#f0cf6a;--dark:#0b0b14;--card:#13131f;--card2:#181828;--border:#252538;--green:#06ffa5;--red:#ff3355;--blue:#4d9fff;--muted:#666;--text:#f0f0f0}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);padding-bottom:3rem}

/* ─── HEADER ─── */
.hdr{background:linear-gradient(180deg,#0d0d20,#0b0b14);border-bottom:3px solid var(--gold);padding:1.2rem 1.2rem .8rem;text-align:center;position:relative}
.hdr-logo{display:flex;align-items:center;justify-content:center;gap:.8rem}
.hdr-logo img{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;box-shadow:0 0 18px rgba(212,175,55,.35)}
.hdr-logo-text{font-family:'Bebas Neue';font-size:2.2rem;color:var(--gold);letter-spacing:5px;line-height:1;text-shadow:0 0 30px rgba(212,175,55,.3)}
.hdr-sub{font-size:.72rem;color:var(--muted);letter-spacing:3px;margin-top:.2rem;text-transform:uppercase}
.hdr-live{display:inline-flex;align-items:center;gap:.4rem;background:rgba(6,255,165,.1);border:1px solid var(--green);color:var(--green);padding:.25rem .7rem;border-radius:12px;font-size:.7rem;font-weight:800;letter-spacing:1px;margin-top:.6rem}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ─── TOURNAMENT TABS ─── */
.t-tabs{display:flex;overflow-x:auto;background:#0d0d1a;border-bottom:1px solid var(--border);gap:0;-webkit-overflow-scrolling:touch}
.t-tabs::-webkit-scrollbar{height:0}
.t-tab{flex-shrink:0;padding:.75rem 1rem;background:none;border:none;color:var(--muted);font-family:'Barlow';font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .2s}
.t-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ─── INNER TABS ─── */
.itabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch}
.itabs::-webkit-scrollbar{height:0}
.itab{flex-shrink:0;padding:.6rem .9rem;background:none;border:none;color:var(--muted);font-family:'Barlow';font-weight:700;font-size:.7rem;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.itab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ─── TABLE ─── */
.tbl-outer{padding:.8rem}
.tbl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.tbl-name{font-family:'Bebas Neue';font-size:1.3rem;color:var(--gold);letter-spacing:2px}
.tbl-sub{font-size:.7rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:360px}
thead tr{background:#0d0d1a}
th{padding:.6rem .5rem;text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);white-space:nowrap;font-weight:800}
th.num{text-align:center}
td{padding:.55rem .5rem;border-bottom:1px solid var(--border);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.num{text-align:center}
tbody tr:last-child td{border-bottom:none}
.pts-cell{font-family:'Bebas Neue';font-size:1.05rem;color:var(--gold);text-align:center}

/* UCL Zones */
.z-q{background:rgba(6,255,165,.05);border-left:3px solid var(--green)}
.z-p{background:rgba(77,159,255,.05);border-left:3px solid var(--blue)}
.z-e{background:rgba(255,51,85,.04);border-left:3px solid var(--red)}
.z-n{border-left:3px solid transparent}

/* Zone legend */
.z-legend{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0 .3rem;padding:0 .1rem}
.zl{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:700;letter-spacing:.5px}
.zl-dot{width:8px;height:8px;border-radius:1px;flex-shrink:0}

/* Results list */
.results-list{padding:.8rem}
.r-item{display:flex;align-items:center;gap:.6rem;padding:.65rem 0;border-bottom:1px solid var(--border)}
.r-item:last-child{border-bottom:none}
.r-score{font-family:'Bebas Neue';font-size:1.05rem;color:var(--gold);letter-spacing:2px;flex-shrink:0;min-width:52px;text-align:center}
.r-match{flex:1;min-width:0}
.r-teams{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta{font-size:.68rem;color:var(--muted);margin-top:.1rem}

/* Fixtures list */
.fix-item{padding:.65rem 0;border-bottom:1px solid var(--border);font-size:.83rem}
.fix-item:last-child{border-bottom:none}
.fix-vs{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fix-sub{font-size:.7rem;color:var(--muted);margin-top:.15rem}

/* Playoff */
.po-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:.9rem;margin-bottom:.7rem}
.po-teams{font-weight:800;font-size:.9rem}
.po-meta{font-size:.72rem;color:var(--muted);margin:.2rem 0}
.po-score{font-family:'Bebas Neue';font-size:1.4rem;color:var(--gold);letter-spacing:3px;text-align:center;padding:.5rem 0}
.po-winner{text-align:center;color:var(--green);font-weight:800;font-size:.8rem}

/* Empty / loading */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:.85rem}
.empty-icon{font-size:2.5rem;margin-bottom:.6rem}
.loading{text-align:center;padding:3rem;color:var(--muted)}

/* Admin link */
.admin-link{text-align:center;padding:.6rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted);background:var(--dark);position:sticky;bottom:0;z-index:50}
.admin-link a{color:var(--gold);text-decoration:none}

/* Group title */
.grp-title{font-family:'Bebas Neue';font-size:1rem;letter-spacing:2px;color:var(--gold);padding:.6rem .8rem .3rem;background:var(--dark)}

/* ─── Winner Ticker ─── */
@keyframes tickerScroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
@keyframes tickerScrollDelay{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.winner-ticker{position:fixed;left:0;width:100%;background:linear-gradient(90deg,#0a0a14,#12122a,#0a0a14);z-index:200;overflow:hidden;height:2.2rem;display:flex;align-items:center}
.winner-ticker.ticker-top{top:0;border-bottom:2px solid var(--gold)}
.winner-ticker.ticker-bottom{bottom:0;border-top:2px solid var(--gold)}
.winner-ticker-inner{white-space:nowrap;font-family:'Bebas Neue';font-size:1rem;letter-spacing:2px;color:var(--gold);text-shadow:0 0 12px rgba(212,175,55,.7);display:inline-block;padding-left:100%}
.winner-ticker-inner.scroll-a{animation:tickerScroll 18s linear infinite}
.winner-ticker-inner.scroll-b{animation:tickerScroll 18s linear infinite;animation-delay:-9s}
.winner-ticker-inner span{color:#fff;margin:0 .4rem}
@keyframes trophyGlow{0%{filter:drop-shadow(0 0 18px rgba(212,175,55,0.8)) drop-shadow(0 0 36px rgba(212,175,55,0.4))}100%{filter:drop-shadow(0 0 32px rgba(212,175,55,1)) drop-shadow(0 0 70px rgba(212,175,55,0.7)) drop-shadow(0 0 100px rgba(255,215,0,0.3))}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo"><img src="jalala_logo.png" alt="Jalala Zone"><span class="hdr-logo-text">JALALA ZONE</span></div>

  <div><span class="hdr-live"><span class="live-dot"></span>LIVE STANDINGS</span></div>
</div>

<!-- TOURNAMENT TABS -->
<div class="t-tabs" id="tTabs"></div>

<!-- INNER TABS -->
<div class="itabs" id="iTabs" style="display:none">

<!-- ADMIN LINK -->
<div class="admin-link">⚙️ Admin? <a href="admin.html">Login here</a></div>

<!-- Single unified module script — Firebase SDK + all app logic in one scope -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyCYHVDq8D492xais1q06ra4GtzNawpsNEA",
  authDomain: "jalala-zone.firebaseapp.com",
  projectId: "jalala-zone",
  storageBucket: "jalala-zone.firebasestorage.app",
  messagingSenderId: "1017844260648",
  appId: "1:1017844260648:web:6273826b83aa86fe37fa1d",
  databaseURL: "https://jalala-zone-default-rtdb.firebaseio.com"
};
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

function fetchFromFirebase(){
  const r = ref(database, 'tournaments');
  get(r).then(snap => {
    const data = snap.val();
    if(data){
      const tours = Object.values(data);
      const localRaw = localStorage.getItem('jalala_db');
      const localDb = localRaw ? JSON.parse(localRaw) : {tournaments:[]};
      tours.forEach(t => {
        const idx = localDb.tournaments.findIndex(x => x.id === t.id);
        if(idx === -1) localDb.tournaments.push(t);
        else localDb.tournaments[idx] = t;
      });
      localStorage.setItem('jalala_db', JSON.stringify(localDb));
      // db is in THIS scope — no cross-script reference needed
      db = localDb;
      renderTournamentTabs();
      render(activeSection);
      updateWinnerTicker();
    }
  }).catch(()=>{});
}

let db={tournaments:[]};
let activeTid=null;
let activeSection='table';

function load(){
  const d=localStorage.getItem('jalala_db');
  if(d)db=JSON.parse(d);
}

function init(){
  load();
  renderTournamentTabs();
}

function renderTournamentTabs(){
  const tabs=document.getElementById('tTabs');
  const tours=db.tournaments;

  if(!tours.length){
    tabs.style.display='none';
    document.getElementById('secTable').innerHTML='<div class="empty"><div class="empty-icon">⏳</div><p>Loading tournament data…<br>Please wait a moment.</p></div>';
    return;
  }

  tabs.innerHTML=tours.map(t=>`<button class="t-tab ${activeTid===t.id?'active':''}" onclick="openTour('${t.id}')">${t.name}</button>`).join('');
  if(!activeTid)openTour(tours[0].id);
}

function openTour(tid){
  activeTid=tid;
  document.querySelectorAll('.t-tab').forEach(el=>el.classList.remove('active'));
  document.querySelector(`.t-tab[onclick="openTour('${tid}')"]`)?.classList.add('active');
  document.getElementById('iTabs').style.display='flex';
  showSec('table');
}

function showSec(name){
  activeSection=name;
  ['table','results','fixtures','playoffs','goals','rules'].forEach(s=>{
    document.getElementById('sec'+cap(s)).style.display=s===name?'block':'none';
    document.getElementById('it-'+s).classList.toggle('active',s===name);
  });
  render(name);
}
function cap(s){return s[0].toUpperCase()+s.slice(1);}

function getTour(){return db.tournaments.find(t=>t.id===activeTid);}

// ── TABLE ──
function render(name){
  load();
  if(name==='table')renderTable();
  else if(name==='results')renderResults();
  else if(name==='fixtures')renderFixtures();
  else if(name==='playoffs')renderPlayoffs();
  else if(name==='goals')renderGoalsRanking();
  else if(name==='rules')renderRules();
}

function sortTeams(teams){
  return [...teams].sort((a,b)=>{
    if(b.points!==a.points)return b.points-a.points;
    const gdA=a.goalsFor-a.goalsAgainst;
    const gdB=b.goalsFor-b.goalsAgainst;
    if(gdB!==gdA)return gdB-gdA;
    return b.goalsFor-a.goalsFor;
  });
}

function renderTable(){
  const tour=getTour();
  const el=document.getElementById('secTable');
  if(!tour){el.innerHTML='<div class="empty">No data</div>';return;}

  let html=`<div class="tbl-outer">
    <div class="tbl-header">
      <div>
        <div class="tbl-name">${tour.name}</div>
        <div class="tbl-sub">${tour.season||''} · ${tour.format==='league'?'League Phase':'Group Stage'} · ${tour.teams.length} Teams</div>
      </div>
    </div>`;

  if(!tour.teams.length){html+='<div class="empty" style="padding:2rem 0">No teams registered yet</div></div>';el.innerHTML=html;return;}

  if(tour.format==='league'){
    html+=buildTable(tour,sortTeams(tour.teams));
  } else {
    const groups={};
    tour.teams.forEach(t=>{if(!groups[t.group])groups[t.group]=[];groups[t.group].push(t);});
    Object.keys(groups).sort().forEach(g=>{
      html+=`<div class="grp-title">GROUP ${g}</div>`;
      html+=buildTable(tour,sortTeams(groups[g]),g);
    });
  }
  html+=`</div>`;
  el.innerHTML=html;
}

function buildTable(tour,teams,group){
  // Determine how many teams qualify:
  // 1. If a bracket exists, count the actual seeded teams across ALL first-round matches
  // 2. Otherwise fall back to leagueAdv / groupAdv from settings
  let adv;
  if(tour.format==='groups'){
    adv=tour.groupAdv;
  } else if(tour.bracketRounds && tour.bracketRounds.length){
    // Find the first real round (not 3rd place) and count how many unique team slots exist
    const firstRound=tour.bracketRounds.find(r=>r.matches&&r.matches[0]&&!r.matches[0].is3rd);
    if(firstRound){
      // Each match has 2 teams → total bracket size = matches in first round × 2
      adv=firstRound.matches.length*2;
    } else {
      adv=tour.bracketSize||tour.leagueAdv;
    }
  } else {
    adv=tour.leagueAdv;
  }
  const playoffZone=0;

  let h=`<div class="tbl-wrap"><table>
    <thead><tr>
      <th>POS</th>
      <th>TEAM</th>
      <th class="num">P</th>
      <th class="num">W</th>
      <th class="num">D</th>
      <th class="num">L</th>
      <th class="num">GF</th>
      <th class="num">GA</th>
      <th class="num">GD</th>
      <th class="num">PTS</th>
    </tr></thead><tbody>`;

  teams.forEach((t,i)=>{
    const pos=i+1;
    const gd=t.goalsFor-t.goalsAgainst;
    let zone='z-n';
    if(pos<=adv)zone='z-q';
    else if(tour.playoffOn&&pos<=adv+playoffZone)zone='z-p';
    else zone='z-e';

    // Separator after qualifying zone and after playoff zone
    const topBorder=(i===adv||( tour.playoffOn&&i===adv+playoffZone))
      ?'border-top:1.5px dashed rgba(255,255,255,.15)':'';

    h+=`<tr class="${zone}" style="${topBorder}">
      <td><strong style="font-size:.88rem">${pos}</strong></td>
      <td><strong>${t.name}</strong></td>
      <td class="num">${t.played}</td>
      <td class="num">${t.won}</td>
      <td class="num">${t.drawn}</td>
      <td class="num">${t.lost}</td>
      <td class="num">${t.goalsFor}</td>
      <td class="num">${t.goalsAgainst}</td>
      <td class="num">${gd>=0?'+':''}${gd}</td>
      <td class="pts-cell">${t.points}</td>
    </tr>`;
  });

  h+=`</tbody></table></div>`;

  // Legend
  const hasBracket = tour.bracketRounds && tour.bracketRounds.length &&
    tour.bracketRounds.some(r=>r.matches&&r.matches[0]&&!r.matches[0].is3rd);
  const qualLabel = hasBracket ? `Qualified – Playoffs (Top ${adv})` : `Qualified (Top ${adv})`;
  h+=`<div class="z-legend">
    <span class="zl"><span class="zl-dot" style="background:var(--green)"></span><span style="color:var(--green)">${qualLabel}</span></span>
    ${!hasBracket&&tour.playoffOn&&playoffZone?`<span class="zl"><span class="zl-dot" style="background:var(--blue)"></span><span style="color:var(--blue)">Playoff Zone</span></span>`:''}
    <span class="zl"><span class="zl-dot" style="background:var(--red)"></span><span style="color:var(--red)">Eliminated</span></span>
  </div>`;

  return h;
}

// ── RESULTS ──
function renderResults(){
  const tour=getTour();
  const el=document.getElementById('secResults');
  if(!tour){el.innerHTML='<div class="empty">No data</div>';return;}
  const done=[...tour.matches.filter(m=>m.done)].reverse();
  if(!done.length){el.innerHTML='<div class="empty"><div class="empty-icon">⚽</div>No results yet</div>';return;}
  const rounds=[...new Set(done.map(m=>m.round))];
  let h='';
  rounds.forEach(r=>{
    const rMatches=done.filter(m=>m.round===r);
    h+=`<div style="margin-bottom:1.4rem">
      <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <div style="font-family:'Bebas Neue';font-size:.95rem;letter-spacing:2px;color:var(--green);padding:.2rem .8rem;background:rgba(6,255,165,.08);border:1px solid rgba(6,255,165,.25);border-radius:20px;white-space:nowrap">✅ ${r}</div>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>`;
    rMatches.forEach(m=>{
      h+=`<div class="r-item">
        <div class="r-match">
          <div class="r-teams">${m.homeName} vs ${m.awayName}</div>
          ${m.date?`<div class="r-meta">${m.date}</div>`:''}
        </div>
        <div class="r-score">${m.homeScore} – ${m.awayScore}</div>
      </div>`;
    });
    h+='</div>';
  });
  el.innerHTML=h;
}

// ── FIXTURES ──
function renderFixtures(){
  const tour=getTour();
  const el=document.getElementById('secFixtures');
  if(!tour){el.innerHTML='<div class="empty">No data</div>';return;}
  const pending=tour.matches.filter(m=>!m.done);
  if(!pending.length){el.innerHTML='<div class="empty"><div class="empty-icon">📅</div>No upcoming fixtures</div>';return;}
  const rounds=[...new Set(pending.map(m=>m.round))];
  let h='';
  rounds.forEach(r=>{
    h+=`<div style="margin-bottom:1.4rem">
      <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:.6rem">
        <div style="flex:1;height:1px;background:var(--border)"></div>
        <div style="font-family:'Bebas Neue';font-size:.95rem;letter-spacing:2px;color:var(--gold);padding:.2rem .8rem;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);border-radius:20px;white-space:nowrap">📅 ${r}</div>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>`;
    pending.filter(m=>m.round===r).forEach(m=>{
      h+=`<div class="fix-item">
        <div class="fix-vs">${m.homeName} <span style="color:var(--muted);font-weight:400">vs</span> ${m.awayName}</div>
        <div class="fix-sub">${m.date||'Date TBC'}</div>
      </div>`;
    });
    h+='</div>';
  });
  el.innerHTML=h;
}

// ── PLAYOFFS ──
function renderPlayoffs(){
  const tour=getTour();
  const bc=document.getElementById('bracketContent');
  const el=bc||document.getElementById('secPlayoffs');
  if(!tour){
    document.getElementById('trophySplash').style.display='none';
    el.innerHTML='<div class="empty">No data</div>';
    return;
  }
  // Keep trophy splash, only replace content below it
  updateTrophySplash(tour);

  // ── New bracket format (from admin_dashboard simulateBracket) ──
  if(tour.bracketRounds&&tour.bracketRounds.length){
    const mainRounds=tour.bracketRounds.filter(r=>r.matches[0]&&!r.matches[0].is3rd);
    const thirdRound=tour.bracketRounds.find(r=>r.matches[0]&&r.matches[0].is3rd);

    function safeScore(h,a){
      if(h===null||h===undefined||a===null||a===undefined) return null;
      return h+'–'+a;
    }

    function etPkBadge(etH,etA,pkH,pkA){
      let s='';
      if(etH!==null&&etH!==undefined&&etA!==null&&etA!==undefined)
        s+=`<span style="color:var(--blue);font-size:.58rem;margin-left:.3rem">ET ${etH}–${etA}</span>`;
      if(pkH!==null&&pkH!==undefined&&pkA!==null&&pkA!==undefined)
        s+=`<span style="color:#ff9500;font-size:.58rem;margin-left:.3rem">PK ${pkH}–${pkA}</span>`;
      return s;
    }

    function matchCard(m){
      const t1=m.t1?m.t1.name:'TBD';
      const t2=m.t2?m.t2.name:'TBD';
      const isHA=m.legs===2;
      const s1=safeScore(m.leg1h,m.leg1a);
      const s2=safeScore(m.leg2h,m.leg2a);
      const winnerName=m.winner?m.winner.name:null;
      const w1=winnerName===t1;
      const w2=winnerName===t2;
      // Build leg lines for H&A
      let leg2Line='';
      if(isHA){
        const agg1=m.leg1h!==null&&m.leg2a!==null?(m.leg1h||0)+(m.leg2a||0):null;
        const agg2=m.leg1a!==null&&m.leg2h!==null?(m.leg1a||0)+(m.leg2h||0):null;
        const aggStr=(agg1!==null&&agg2!==null&&s2)?` · Agg: ${agg1}–${agg2}`:'';
        leg2Line=`<div style="font-size:.6rem;color:var(--muted);border-top:1px solid rgba(255,255,255,.07);padding-top:.25rem;margin-top:.15rem">
          <span>Leg 1: ${s1||'TBC'}${etPkBadge(m.et1h,m.et1a,m.pk1h,m.pk1a)}</span><br>
          <span>Leg 2: ${s2||'TBC'}${etPkBadge(m.et2h,m.et2a,m.pk2h,m.pk2a)}${aggStr}</span>
        </div>`;
      }
      const et1badge=!isHA?etPkBadge(m.et1h,m.et1a,m.pk1h,m.pk1a):'';
      return `<div style="background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:.55rem .7rem;font-size:.75rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem">
          <span style="font-weight:700;color:${w1?'var(--gold)':'var(--text)'};flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%">${t1}${w1?' 🏆':''}</span>
          <span style="font-family:'Bebas Neue';font-size:.8rem;color:${s1?'var(--text)':'var(--muted)'};min-width:2.5rem;text-align:right">${isHA?'':s1||'TBC'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center${isHA?';margin-bottom:.2rem':''}">
          <span style="font-weight:700;color:${w2?'var(--gold)':'var(--text)'};flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:65%">${t2}${w2?' 🏆':''}</span>
          <span style="font-family:'Bebas Neue';font-size:.8rem;color:var(--muted);min-width:2.5rem;text-align:right">${isHA?'':'–'}</span>
        </div>
        ${isHA?leg2Line:`${et1badge?`<div style="margin-top:.2rem;font-size:.6rem">${et1badge}</div>`:''}`}
        ${!winnerName&&!m.done?'<div style="font-size:.6rem;color:var(--muted);text-align:center;margin-top:.2rem">⏳ Pending</div>':''}
      </div>`;
    }

        ${!winnerName&&!m.done?'<div style="font-size:.6rem;color:var(--muted);text-align:center;margin-top:.2rem">⏳ Pending</div>':''}
      </div>`;
    }

    // ── RESPONSIVE bracket — fills screen width, no horizontal scroll ──
    const finalRound=mainRounds[mainRounds.length-1];
    const preFinalRounds=mainRounds.slice(0,mainRounds.length-1);

    const leftCols=preFinalRounds.map(r=>({name:r.name,matches:r.matches.slice(0,Math.ceil(r.matches.length/2))}));
    const rightCols=[...preFinalRounds].reverse().map(r=>({name:r.name,matches:r.matches.slice(Math.ceil(r.matches.length/2))}));

    // Total flex sections: each side col + connector, plus center
    // e.g. 8-team: QF+conn+SF+conn | center | conn+SF+conn+QF = 4 side cols + 4 conns + 1 center
    const sideCols = leftCols.length; // same as rightCols
    // We give: each side col = flex 10, each connector = flex 1.5, center = flex 14
    const colFlex = 10;
    const connFlex = 1.5;
    const centerFlex = 16;

    function connector(dir){
      const isRight=dir==='right';
      return `<div style="flex:${connFlex};display:flex;flex-direction:column;justify-content:center;align-items:center;align-self:stretch;min-width:0">
        <div style="flex:1;${isRight?'border-right':'border-left'}:2px solid rgba(212,175,55,.5);border-top:2px solid rgba(212,175,55,.5);${isRight?'border-radius:0 6px 0 0':'border-radius:6px 0 0 0'};width:50%;${isRight?'margin-right:-1px':'margin-left:-1px'}"></div>
        <div style="width:100%;height:2px;background:rgba(212,175,55,.5)"></div>
        <div style="flex:1;${isRight?'border-right':'border-left'}:2px solid rgba(212,175,55,.5);border-bottom:2px solid rgba(212,175,55,.5);${isRight?'border-radius:0 0 6px 0':'border-radius:0 0 0 6px'};width:50%;${isRight?'margin-right:-1px':'margin-left:-1px'}"></div>
      </div>`;
    }

    function colLabel(name){
      return `<div style="font-family:'Bebas Neue';font-size:.65rem;letter-spacing:1.5px;color:var(--gold);text-align:center;margin-bottom:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>`;
    }

    // Compact match card that works at any width
    function compactCard(m){
      const t1=m.t1?m.t1.name:'TBD';
      const t2=m.t2?m.t2.name:'TBD';
      const isHA=m.legs===2;
      const s1=m.leg1h!=null&&m.leg1a!=null?m.leg1h+'–'+m.leg1a:null;
      const s2=m.leg2h!=null&&m.leg2a!=null?m.leg2h+'–'+m.leg2a:null;
      const w1=m.winner&&m.winner.name===t1;
      const w2=m.winner&&m.winner.name===t2;
      // For H&A show aggregate in compact card
      let scoreLabel='–';
      if(isHA&&s1&&s2){
        const agg1=(m.leg1h||0)+(m.leg2a||0);
        const agg2=(m.leg1a||0)+(m.leg2h||0);
        scoreLabel=`${agg1}–${agg2}`;
      } else if(!isHA&&s1){
        scoreLabel=s1;
      }
      const etPk=[];
      if(m.et1h!=null)etPk.push(`ET ${m.et1h}–${m.et1a}`);
      if(m.pk1h!=null)etPk.push(`PK ${m.pk1h}–${m.pk1a}`);
      if(m.pk2h!=null&&isHA)etPk.push(`PK ${m.pk2h}–${m.pk2a}`);
      return `<div style="background:rgba(255,255,255,.05);border:1px solid ${m.done?'rgba(212,175,55,.6)':'var(--border)'};border-radius:6px;padding:.3rem .4rem;font-size:.68rem;width:100%;box-sizing:border-box">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:2px;margin-bottom:.15rem">
          <span style="font-weight:700;color:${w1?'var(--gold)':'var(--text)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0">${t1}</span>
          <span style="font-family:'Bebas Neue';color:${scoreLabel!=='–'?'var(--text)':'var(--muted)'};flex-shrink:0;font-size:.75rem;margin-left:2px">${scoreLabel}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:2px">
          <span style="font-weight:700;color:${w2?'var(--gold)':'var(--text)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0">${t2}</span>
          <span style="font-family:'Bebas Neue';color:var(--muted);flex-shrink:0;font-size:.75rem;margin-left:2px">${isHA&&s1&&!s2?s1:''}</span>
        </div>
        ${etPk.length?`<div style="font-size:.55rem;color:#ff9500;margin-top:.1rem;text-align:center">${etPk.join(' · ')}</div>`:(!m.done&&!m.winner?'<div style="font-size:.55rem;color:var(--muted);text-align:center;margin-top:.1rem">⏳</div>':'')}
      </div>`;
    }

    // Cup size: scales with viewport but capped

    let html=`<div style="width:100%;padding:.5rem 0 1rem;box-sizing:border-box">
      <div style="display:flex;width:100%;align-items:stretch;box-sizing:border-box;padding:0 2px">`;

    // LEFT columns
    leftCols.forEach((col,i)=>{
      html+=`<div style="flex:${colFlex};display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">
        ${colLabel(col.name)}
        ${col.matches.map(m=>compactCard(m)).join('<div style="min-height:6px"></div>')}
      </div>`;
      html+=connector('right');
    });

    // CENTER
    html+=`<div style="flex:${centerFlex};display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:0 2px">
      <img src="jalala_cup.png" style="width:80%;max-width:120px;height:auto;object-fit:contain;filter:drop-shadow(0 0 20px rgba(212,175,55,0.9));display:block;margin:0 auto">
      <div style="font-family:'Bebas Neue';font-size:clamp(.6rem,.9rem,1rem);letter-spacing:2px;color:var(--gold);text-align:center;margin:.2rem 0 .4rem;text-shadow:0 0 8px rgba(212,175,55,.6)">⚽ FINAL ⚽</div>
      <div style="width:100%">${compactCard(finalRound.matches[0])}</div>
      ${finalRound.matches[0].winner?`<div style="font-family:'Bebas Neue';font-size:clamp(.6rem,.8rem,1rem);color:var(--gold);text-align:center;margin-top:.3rem">🏆 ${finalRound.matches[0].winner.name}</div>`:''}
    </div>`;

    // RIGHT columns
    rightCols.forEach((col,i)=>{
      html+=connector('left');
      html+=`<div style="flex:${colFlex};display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0">
        ${colLabel(col.name)}
        ${col.matches.map(m=>compactCard(m)).join('<div style="min-height:6px"></div>')}
      </div>`;
    });

    html+=`</div></div>`;

    if(thirdRound){
      html+=`<div style="margin-top:.7rem;background:rgba(205,127,50,.08);border:1px solid rgba(205,127,50,.3);border-radius:8px;padding:.6rem .8rem">
        <div style="font-family:'Bebas Neue';font-size:.65rem;letter-spacing:2px;color:#cd7f32;margin-bottom:.4rem">🥉 3RD PLACE</div>
        ${matchCard(thirdRound.matches[0])}
        ${thirdRound.matches[0].winner?`<div style="font-size:.6rem;color:#cd7f32;text-align:center;margin-top:.3rem">3rd: ${thirdRound.matches[0].winner.name}</div>`:''}
      </div>`;
    }

    // ── Results list below bracket ──
    const allRounds=[...mainRounds,...(thirdRound?[thirdRound]:[])];
    const doneRounds=allRounds.filter(r=>r.matches.some(m=>m.done));
    if(doneRounds.length){
      html+=`<div style="margin-top:1rem;padding:.3rem 0">
        <div style="font-family:'Bebas Neue';font-size:.85rem;letter-spacing:2px;color:var(--gold);padding:.4rem .8rem;background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.2);border-radius:8px;margin-bottom:.5rem">📋 RESULTS</div>`;
      doneRounds.forEach(r=>{
        const doneMatches=r.matches.filter(m=>m.done);
        if(!doneMatches.length)return;
        const isFinal=r.matches[0]&&r.matches[0].isFinal;
        const is3rd=r.matches[0]&&r.matches[0].is3rd;
        const roundLabel=is3rd?'🥉 3rd Place Match':isFinal?'🏆 Final':r.name;
        html+=`<div style="margin-bottom:.7rem">
          <div style="font-size:.65rem;font-weight:800;letter-spacing:1.5px;color:${isFinal?'var(--gold)':is3rd?'#cd7f32':'var(--green)'};padding:.2rem .5rem;background:rgba(255,255,255,.04);border-radius:4px;margin-bottom:.4rem;display:inline-block">${roundLabel}</div>`;
        doneMatches.forEach(m=>{
          const t1=m.t1?m.t1.name:'?';
          const t2=m.t2?m.t2.name:'?';
          const isHA=m.legs===2;
          const w=m.winner?m.winner.name:null;
          let scoreDisplay='';
          if(isHA){
            const s1=m.leg1h!=null?`${m.leg1h}–${m.leg1a}`:'?';
            const s2=m.leg2h!=null?`${m.leg2h}–${m.leg2a}`:'?';
            const agg1=(m.leg1h||0)+(m.leg2a||0);
            const agg2=(m.leg1a||0)+(m.leg2h||0);
            scoreDisplay=`<div style="font-size:.62rem;color:var(--muted)">Leg 1: ${s1} · Leg 2: ${s2}</div>
              <div style="font-family:'Bebas Neue';font-size:.9rem;color:var(--gold);letter-spacing:1px">Agg: ${agg1}–${agg2}</div>`;
          } else {
            const s=m.leg1h!=null?`${m.leg1h}–${m.leg1a}`:'?';
            scoreDisplay=`<div style="font-family:'Bebas Neue';font-size:1rem;color:var(--gold);letter-spacing:2px">${s}</div>`;
          }
          const etPkLine=[];
          if(m.et1h!=null)etPkLine.push(`ET ${m.et1h}–${m.et1a}`);
          if(m.pk1h!=null)etPkLine.push(`PK ${m.pk1h}–${m.pk1a}`);
          if(m.et2h!=null&&isHA)etPkLine.push(`ET2 ${m.et2h}–${m.et2a}`);
          if(m.pk2h!=null&&isHA)etPkLine.push(`PK2 ${m.pk2h}–${m.pk2a}`);
          html+=`<div style="display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--border)">
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                <span style="color:${w===t1?'var(--gold)':'var(--text)'}">${t1}</span>
                <span style="color:var(--muted);font-weight:400;font-size:.75rem"> vs </span>
                <span style="color:${w===t2?'var(--gold)':'var(--text)'}">${t2}</span>
              </div>
              ${etPkLine.length?`<div style="font-size:.6rem;color:#ff9500;margin-top:.1rem">${etPkLine.join(' · ')}</div>`:''}
            </div>
            <div style="text-align:right;flex-shrink:0">
              ${scoreDisplay}
              ${w?`<div style="font-size:.6rem;color:var(--green);font-weight:800">🏆 ${w}</div>`:''}
            </div>
          </div>`;
        });
        html+='</div>';
      });
      html+='</div>';
    }

    el.innerHTML=html;
    return;
  }

  // ── Legacy tiebreak playoffs array ──
  if(!tour.playoffs||!tour.playoffs.length){el.innerHTML='<div class="empty"><div class="empty-icon">🏆</div>No playoff matches yet</div>';return;}
  el.innerHTML=tour.playoffs.map(po=>`
    <div class="po-item">
      <div class="po-teams">${po.t1name} <span style="color:var(--muted);font-weight:400">vs</span> ${po.t2name}</div>
      <div class="po-meta">${po.round}${po.reason?' · '+po.reason:''} · ${po.legs===2?'Home & Away':'Single Match'}</div>
      ${po.leg1h!==null?`<div class="po-score">${po.leg1h} – ${po.leg1a}</div>`:'<div class="po-score" style="color:var(--muted)">vs</div>'}
      ${po.legs===2&&po.leg2h!==null?`<div style="text-align:center;font-size:.7rem;color:var(--muted)">Leg 2: ${po.leg2h} – ${po.leg2a}</div>`:''}
      ${po.agg?`<div style="text-align:center;font-size:.72rem;color:var(--muted)">Agg: ${po.agg}</div>`:''}
      ${po.winner?`<div class="po-winner">🏆 Winner: ${po.winner}</div>`:po.done?'':'<div style="text-align:center;font-size:.72rem;color:var(--muted)">Pending</div>'}
    </div>`).join('');
}

// ── GOALS RANKING ──
function renderGoalsRanking(){
  const tour=getTour();
  const el=document.getElementById('secGoals');
  if(!tour){el.innerHTML='<div class="empty">No data</div>';return;}
  if(!tour.teams.length){el.innerHTML='<div class="empty"><div class="empty-icon">⚽</div>No teams yet</div>';return;}

  // Build a goals map including playoff/bracket goals
  const playoffGoals={};
  if(tour.bracketRounds){
    tour.bracketRounds.forEach(r=>r.matches.forEach(m=>{
      if(!m.t1||!m.t2)return;
      const id1=m.t1.id,id2=m.t2.id;
      if(!playoffGoals[id1])playoffGoals[id1]=0;
      if(!playoffGoals[id2])playoffGoals[id2]=0;
      // Leg 1: t1 is home
      if(m.leg1h!=null){playoffGoals[id1]+=m.leg1h;playoffGoals[id2]+=m.leg1a;}
      if(m.et1h!=null){playoffGoals[id1]+=m.et1h;playoffGoals[id2]+=m.et1a;}
      // Leg 2: t2 is home
      if(m.leg2h!=null){playoffGoals[id2]+=m.leg2h;playoffGoals[id1]+=m.leg2a;}
      if(m.et2h!=null){playoffGoals[id2]+=m.et2h;playoffGoals[id1]+=m.et2a;}
    }));
  }

  const teamsWithTotal=tour.teams.map(t=>({
    ...t,
    totalGoals:(t.goalsFor||0)+(playoffGoals[t.id]||0),
    playoffGoals:playoffGoals[t.id]||0
  }));
  const sorted=[...teamsWithTotal].sort((a,b)=>b.totalGoals-a.totalGoals);
  const max=sorted[0].totalGoals||1;

  let h=`<div style="padding:.8rem">
    <div style="font-family:'Bebas Neue';font-size:1.3rem;letter-spacing:3px;color:var(--gold);margin-bottom:1rem;text-align:center">⚽ Team Goals Ranking</div>`;

  sorted.forEach((t,i)=>{
    const pct=Math.round((t.totalGoals/max)*100);
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
    const barColor=i===0?'var(--gold)':i===1?'#c0c0c0':i===2?'#cd7f32':'var(--blue)';
    const extraInfo=t.playoffGoals>0?`<span style="font-size:.6rem;color:var(--blue);margin-left:.4rem">(+${t.playoffGoals} playoff)</span>`:'';
    h+=`<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;margin-bottom:.6rem">
      <div style="display:flex;align-items:center;gap:.7rem;margin-bottom:.5rem">
        <div style="font-family:'Bebas Neue';font-size:1.1rem;color:var(--muted);width:1.4rem;text-align:center">${i+1}</div>
        <div style="flex:1;font-weight:700;font-size:.9rem">${medal} ${t.name}${extraInfo}</div>
        <div style="font-family:'Bebas Neue';font-size:1.1rem;color:var(--gold);background:rgba(212,175,55,.12);padding:.15rem .6rem;border-radius:6px">${t.totalGoals} <span style="font-size:.7rem;color:var(--muted)">GF</span></div>
      </div>
      <div style="background:var(--border);border-radius:4px;height:6px;overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${barColor};border-radius:4px;transition:width .4s"></div>
      </div>
    </div>`;
  });

  h+=`</div>`;
  el.innerHTML=h;
}

  el.innerHTML=`
    <div style="padding:.8rem">
      <div style="display:flex;align-items:center;gap:.6rem;margin-bottom:1.2rem">

        <div style="font-family:'Bebas Neue';font-size:1rem;letter-spacing:2px;color:var(--gold);padding:.2rem .8rem;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.3);border-radius:20px;white-space:nowrap">📜 ${tour.rulesTitle||'Tournament Rules & Regulations'}</div>
        <div style="flex:1;height:1px;background:var(--border)"></div>
      </div>
      <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.2rem;white-space:pre-wrap;font-size:.88rem;line-height:1.85;color:var(--text)">${tour.rulesBody.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>

// ── Winner ticker ──────────────────────────────────────────────
function updateWinnerTicker(){
  const tour=getTour();
  const tickerTop=document.getElementById('winnerTickerTop');
  const tickerBot=document.getElementById('winnerTickerBottom');
  const textTop=document.getElementById('winnerTickerTextTop');
  const textBot=document.getElementById('winnerTickerTextBottom');
  if(!tickerTop||!tickerBot)return;

  // Trophy splash always re-renders
  updateTrophySplash(tour);

  if(!tour||!tour.winnerTickerOn){
    tickerTop.style.display='none';
    tickerBot.style.display='none';
    document.body.style.paddingBottom='3rem';
    document.body.style.paddingTop='0';
    return;
  }
  // Find winner name
  let winnerName='';
  if(tour.bracketRounds&&tour.bracketRounds.length){
    const finalRound=tour.bracketRounds.filter(r=>r.matches[0]&&!r.matches[0].is3rd).slice(-1)[0];
    if(finalRound&&finalRound.matches[0]&&finalRound.matches[0].winner)
      winnerName=finalRound.matches[0].winner.name;
  }
  const tickerMsg=winnerName
    ?`🏆  ⚽ EFOOTBALL JALALA LEAGUE ${tour.name||''} WINNER IS  ★  ${winnerName.toUpperCase()}  ★  CONGRATULATIONS  🎉  ⚽  🏆  ⚽ EFOOTBALL JALALA LEAGUE ${tour.name||''} WINNER IS  ★  ${winnerName.toUpperCase()}  ★  CONGRATULATIONS  🎉`
    :`🏆  ⚽ EFOOTBALL JALALA LEAGUE ${tour.name||''} — FINALS UNDERWAY — STAY TUNED!  🏆`;
  textTop.textContent=tickerMsg;
  textBot.textContent=tickerMsg;
  tickerTop.style.display='flex';
  tickerBot.style.display='flex';
  document.body.style.paddingTop='2.2rem';
  document.body.style.paddingBottom='5rem';
}

function updateTrophySplash(tour){
  const splash=document.getElementById('trophySplash');
  if(!splash)return;
  const show=tour&&tour.winnerTickerOn&&tour.winnerTrophyImg;
  if(!show){splash.style.display='none';return;}
  // Find winner name
  let winnerName='';
  if(tour.bracketRounds&&tour.bracketRounds.length){
    const finalRound=tour.bracketRounds.filter(r=>r.matches[0]&&!r.matches[0].is3rd).slice(-1)[0];
    if(finalRound&&finalRound.matches[0]&&finalRound.matches[0].winner)
      winnerName=finalRound.matches[0].winner.name;
  }
  splash.innerHTML=`
    <div style="text-align:center;padding:1.2rem .8rem 0">
      <div style="font-family:'Bebas Neue';font-size:.75rem;letter-spacing:3px;color:var(--gold);margin-bottom:.5rem;text-shadow:0 0 12px rgba(212,175,55,.6)">🏆 ${tour.name||'JALALA LEAGUE'} CHAMPION 🏆</div>
      <img src="${tour.winnerTrophyImg}" alt="Winner Trophy"
        style="width:70%;max-width:260px;height:auto;object-fit:contain;display:block;margin:0 auto;
          filter:drop-shadow(0 0 22px rgba(212,175,55,0.95)) drop-shadow(0 0 45px rgba(212,175,55,0.55));
          animation:trophyGlow 2.5s ease-in-out infinite alternate">
      ${winnerName?`<div style="font-family:'Bebas Neue';font-size:1.6rem;letter-spacing:4px;color:var(--gold);margin-top:.6rem;text-shadow:0 0 20px rgba(212,175,55,.8)">${winnerName}</div>`:''}
      <div style="font-size:.65rem;color:var(--muted);letter-spacing:2px;margin-top:.2rem;text-transform:uppercase">Efootball Jalala League Champions</div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:1rem 0 .3rem"></div>
    </div>`;
  splash.style.display='block';
}


// Auto-refresh every 30s (fallback if Firebase is slow)
setInterval(()=>{load();render(activeSection);updateWinnerTicker();},30000);
// Firebase polling
setInterval(fetchFromFirebase, 30000);

// Expose functions needed by inline onclick="" handlers
window.openTour = openTour;
window.showSec = showSec;

init();
fetchFromFirebase();
updateWinnerTicker();
</script>
</body>
</html>
