<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JALALA Zone – Live Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --gold:#d4af37;--gold2:#f0cf6a;
  --dark:#0b0b14;--card:#13131f;--card2:#181828;--border:#252538;
  --green:#06ffa5;--red:#ff3355;--blue:#4d9fff;
  --muted:#666;--text:#f0f0f0;
  /* NEW in PFL v31 */
  --tab-bg:#0d0d1a;--thead-bg:#0d0d1a;
  --card-shadow:0 2px 12px rgba(0,0,0,.4);
  --btn-hover:rgba(212,175,55,.08);
}

body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);padding-bottom:3rem}

/* ── HEADER ── */
.hdr{background:linear-gradient(180deg,#0d0d20,#0b0b14);border-bottom:3px solid var(--gold);padding:1.2rem 1.2rem .8rem;text-align:center;position:relative}
.hdr-logo{display:flex;align-items:center;justify-content:center;gap:.8rem}
.hdr-logo img{width:58px;height:58px;border-radius:50%;border:2px solid rgba(212,175,55,.7);object-fit:cover;box-shadow:0 0 24px rgba(212,175,55,.4),0 0 50px rgba(212,175,55,.1)}
.hdr-logo-text{font-family:'Bebas Neue';font-size:2.2rem;color:var(--gold);letter-spacing:5px;line-height:1;text-shadow:0 0 30px rgba(212,175,55,.3)}
.hdr-sub{font-size:.72rem;color:rgba(255,255,255,.45);letter-spacing:3px;margin-top:.2rem;text-transform:uppercase}

/* ── SYNC / LIVE BADGE (NEW) ── */
@keyframes spin{to{transform:rotate(360deg)}}
.hdr-live{display:inline-flex;align-items:center;gap:.4rem;background:rgba(6,255,165,.1);border:1px solid var(--green);color:var(--green);padding:.25rem .7rem;border-radius:12px;font-size:.7rem;font-weight:800;letter-spacing:1px;margin-top:.6rem;transition:all .3s}
.hdr-live.syncing{background:rgba(212,175,55,.12);border-color:var(--gold);color:var(--gold)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-spinner{width:9px;height:9px;border:2px solid rgba(212,175,55,.3);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:none;flex-shrink:0}
.hdr-live.syncing .live-dot{display:none}
.hdr-live.syncing .sync-spinner{display:block}
.hdr-live.syncing .live-text::before{content:'SYNCING…'}
.hdr-live:not(.syncing) .live-text::before{content:'LIVE STANDINGS'}

/* ── TOURNAMENT TABS ── */
.t-tabs{display:flex;overflow-x:auto;background:var(--tab-bg);border-bottom:1px solid var(--border);gap:0;-webkit-overflow-scrolling:touch}
.t-tabs::-webkit-scrollbar{height:0}
.t-tab{flex-shrink:0;padding:.75rem 1rem;background:none;border:none;color:var(--muted);font-family:'Barlow';font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:color .2s,background .2s}
.t-tab:hover{color:var(--gold);background:var(--btn-hover)}
.t-tab:active{transform:scale(.97)}
.t-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(212,175,55,.05)}

/* ── TOP-LEVEL TAB BAR (NEW — Tournaments / Teams / Past Seasons) ── */
#regTabBar{border-bottom:1px solid var(--border);background:var(--tab-bg);display:flex}

/* ── INNER TABS ── */
.itabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--tab-bg);-webkit-overflow-scrolling:touch}
.itabs::-webkit-scrollbar{height:0}
.itab{flex-shrink:0;padding:.6rem .9rem;background:none;border:none;color:var(--muted);font-family:'Barlow';font-weight:700;font-size:.7rem;text-transform:uppercase;cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,background .2s}
.itab:hover{color:var(--gold);background:var(--btn-hover)}
.itab:active{transform:scale(.97)}
.itab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(212,175,55,.05)}

/* ── TABLE ── */
.tbl-outer{padding:.8rem}
.tbl-name{font-family:'Bebas Neue';font-size:1.3rem;color:var(--gold);letter-spacing:2px}
.tbl-sub{font-size:.7rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border);box-shadow:var(--card-shadow)}
table{width:100%;border-collapse:collapse;font-size:.82rem;min-width:360px}
thead tr{background:var(--thead-bg)}
th{padding:.6rem .5rem;text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);white-space:nowrap;font-weight:800}
th.num{text-align:center}
td{padding:.55rem .5rem;border-bottom:1px solid var(--border);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--card)}
td.num{text-align:center}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{filter:brightness(1.04)}
.pts-cell{font-family:'Bebas Neue';font-size:1.05rem;color:var(--gold);text-align:center}
/* Zone colours applied per-TD (NEW) */
.z-q td{background:rgba(6,255,165,.05)!important}
.z-e td{background:rgba(255,51,85,.04)!important}
.z-q td:first-child{border-left:3px solid var(--green)}
.z-e td:first-child{border-left:3px solid var(--red)}
.z-n{border-left:3px solid transparent}
.z-legend{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0 .3rem;padding:0 .1rem}
.zl{display:inline-flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:700;letter-spacing:.5px}
.zl-dot{width:8px;height:8px;border-radius:1px;flex-shrink:0}

/* ── RESULTS card style (NEW) ── */
.results-list{padding:.8rem}
.r-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem;margin-bottom:.5rem;transition:border-color .2s}
.r-item:hover{border-color:rgba(212,175,55,.35)}
.r-item:last-child{margin-bottom:0}
.r-matchup{display:flex;align-items:center;gap:.5rem;margin-bottom:0}
.r-home-side{flex:1;min-width:0}
.r-away-side{flex:1;min-width:0;text-align:right}
.r-tname{font-weight:800;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-tcoach{font-size:.65rem;color:var(--muted);margin-top:.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-away-side .r-tname{text-align:right}
.r-away-side .r-tcoach{text-align:right}
.r-score-badge{flex-shrink:0;text-align:center}
.r-score{font-family:'Bebas Neue';font-size:1.3rem;color:var(--gold);letter-spacing:3px;line-height:1}
.r-meta{font-size:.62rem;color:var(--muted);text-align:center;margin-top:.15rem}

/* ── FIXTURES card style (NEW) ── */
.fix-item{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:.6rem;overflow:hidden;transition:border-color .2s,box-shadow .2s;box-shadow:var(--card-shadow)}
.fix-item:hover{border-color:rgba(212,175,55,.35)}
.fix-header{display:flex;align-items:center;padding:.7rem .9rem;gap:.5rem}
.fix-team-side{flex:1;min-width:0}
.fix-team-name{font-family:'Bebas Neue';font-size:1.05rem;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;display:block}
.fix-team-coach{font-size:.62rem;color:var(--muted);margin-top:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.fix-home .fix-team-name{color:var(--text);text-align:left}
.fix-home .fix-team-coach{text-align:left}
.fix-away{text-align:right}
.fix-away .fix-team-name{color:var(--text);text-align:right}
.fix-away .fix-team-coach{text-align:right}
.fix-vs-badge{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--card2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.58rem;font-weight:800;color:var(--muted);letter-spacing:.5px}
.fix-footer{display:flex;align-items:center;justify-content:space-between;padding:.35rem .9rem .5rem;border-top:1px solid var(--border);background:var(--card2)}
.fix-date{font-size:.65rem;color:var(--muted)}
.fix-round-label{font-size:.6rem;color:var(--gold);font-weight:700;letter-spacing:.5px;text-transform:uppercase}

/* ── PLAYOFF ITEMS ── */
.po-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:.9rem;margin-bottom:.7rem;box-shadow:var(--card-shadow)}
.po-teams{font-weight:800;font-size:.9rem}
.po-meta{font-size:.72rem;color:var(--muted);margin:.2rem 0}
.po-score{font-family:'Bebas Neue';font-size:1.4rem;color:var(--gold);letter-spacing:3px;text-align:center;padding:.5rem 0}
.po-winner{text-align:center;color:var(--green);font-weight:800;font-size:.8rem}

/* ── MISC ── */
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-size:.85rem}
.empty-icon{font-size:2.5rem;margin-bottom:.6rem}
.admin-link{text-align:center;padding:.6rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted);background:var(--dark);position:sticky;bottom:0;z-index:50}
.admin-link a{color:var(--gold);text-decoration:none;font-weight:700}
.admin-link a:hover{color:var(--gold2)}
.grp-title{font-family:'Bebas Neue';font-size:1rem;letter-spacing:2px;color:var(--gold);padding:.6rem .8rem .3rem;background:var(--dark)}

/* ── TICKER ── */
@keyframes tickerScroll{0%{transform:translateX(100vw)}100%{transform:translateX(-100%)}}
.winner-ticker{position:fixed;left:0;width:100%;background:linear-gradient(90deg,#0a0a14,#12122a,#0a0a14);z-index:200;overflow:hidden;height:2.2rem;display:flex;align-items:center}
.winner-ticker.ticker-top{top:0;border-bottom:2px solid var(--gold)}
.winner-ticker.ticker-bottom{bottom:0;border-top:2px solid var(--gold)}
.winner-ticker-inner{white-space:nowrap;font-family:'Bebas Neue';font-size:1rem;letter-spacing:2px;color:var(--gold);text-shadow:0 0 12px rgba(212,175,55,.7);display:inline-block;padding-left:100%}
.winner-ticker-inner.scroll-a{animation:tickerScroll 18s linear infinite}
.winner-ticker-inner.scroll-b{animation:tickerScroll 18s linear infinite;animation-delay:-9s}
@keyframes trophyGlow{0%{filter:drop-shadow(0 0 18px rgba(212,175,55,0.8)) drop-shadow(0 0 36px rgba(212,175,55,0.4))}100%{filter:drop-shadow(0 0 32px rgba(212,175,55,1)) drop-shadow(0 0 70px rgba(212,175,55,0.7)) drop-shadow(0 0 100px rgba(255,215,0,0.3))}}

/* ── REGISTRY (NEW) ── */
.reg-entry{margin-bottom:.7rem}
.reg-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;display:flex;align-items:center;gap:1rem;transition:border-color .2s,box-shadow .2s;box-shadow:var(--card-shadow)}
.reg-card-tap{cursor:pointer;user-select:none}
.reg-card-tap:hover{border-color:rgba(212,175,55,.4)}
.reg-card-tap:active{background:var(--card2)}
.reg-chevron{font-size:.8rem;color:var(--muted);flex-shrink:0;transition:color .2s}
.reg-expand{background:var(--card2);border:1px solid var(--border);border-top:none;border-radius:0 0 12px 12px;padding:.9rem 1rem}
.reg-badge{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,rgba(212,175,55,.15),rgba(212,175,55,.04));border:2px solid rgba(212,175,55,.4);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.reg-name{font-family:'Bebas Neue';font-size:1.2rem;letter-spacing:2px;color:var(--gold);line-height:1}
.reg-meta{font-size:.7rem;color:var(--muted);margin-top:.2rem}

/* ── TEAM CARD (in-tournament Teams tab, NEW) ── */
.team-select-wrap{margin-bottom:1.2rem}
.team-select-wrap label{display:block;font-size:.68rem;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:.4rem}
.team-dropdown{width:100%;background:var(--card2);border:1.5px solid var(--border);color:var(--text);font-family:'Barlow',sans-serif;font-size:.92rem;font-weight:700;padding:.65rem .8rem;border-radius:8px;appearance:none;-webkit-appearance:none;cursor:pointer;outline:none;transition:border-color .2s}
.team-dropdown:focus{border-color:var(--gold)}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.team-card-header{background:linear-gradient(135deg,var(--card2),var(--card));border-bottom:2px solid var(--gold);padding:1rem 1.2rem .8rem;display:flex;align-items:center;gap:1rem}
.team-card-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,rgba(212,175,55,.2),rgba(212,175,55,.05));border:2px solid rgba(212,175,55,.5);display:flex;align-items:center;justify-content:center;font-size:1.5rem;flex-shrink:0}
.team-card-title{flex:1;min-width:0}
.team-card-name{font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:3px;color:var(--gold);line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-card-coach{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.team-card-pos{font-family:'Bebas Neue';font-size:1.1rem;color:var(--green);letter-spacing:1px;background:rgba(6,255,165,.1);border:1px solid rgba(6,255,165,.3);border-radius:8px;padding:.2rem .6rem;flex-shrink:0;text-align:center}
.team-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border)}
.stat-cell{background:var(--card2);padding:.6rem .4rem;text-align:center}
.stat-val{font-family:'Bebas Neue';font-size:1.3rem;color:var(--gold)}
.stat-lbl{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:.1rem}
.team-card-body{padding:.9rem 1rem}
.form-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.9rem}
.form-label{font-size:.65rem;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.form-squares{display:flex;gap:.35rem}
.form-sq{width:24px;height:24px;border-radius:4px;font-size:.65rem;font-weight:800;display:flex;align-items:center;justify-content:center;color:#000}
.form-sq.W{background:var(--green)}
.form-sq.D{background:var(--gold)}
.form-sq.L{background:var(--red)}
.form-sq.none{background:var(--border);color:var(--muted)}
.extra-stats{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.extra-stat-item{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:.55rem .7rem;display:flex;justify-content:space-between;align-items:center}
.extra-stat-lbl{font-size:.7rem;color:var(--muted)}
.extra-stat-val{font-family:'Bebas Neue';font-size:1.05rem;color:var(--text)}

/* ── PAST SEASONS (NEW) ── */
.past-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;margin-bottom:.8rem;cursor:pointer;transition:border-color .2s,box-shadow .2s;box-shadow:var(--card-shadow)}
.past-card:hover{border-color:rgba(212,175,55,.4)}
.past-card:active{background:var(--card2)}
.past-card-name{font-family:'Bebas Neue';font-size:1.3rem;letter-spacing:2px;color:var(--gold);line-height:1}
.past-card-meta{font-size:.72rem;color:var(--muted);margin-top:.25rem}
.past-view-header{display:flex;align-items:center;gap:.7rem;padding:.8rem;background:var(--card);border-bottom:1px solid var(--border)}
.past-back{background:none;border:none;color:var(--gold);font-size:1.2rem;cursor:pointer;flex-shrink:0}
.past-view-name{font-family:'Bebas Neue';font-size:1.1rem;letter-spacing:1.5px;color:var(--gold)}

/* ── PER-TOURNAMENT TEAM STAT ROWS (in registry expand, NEW) ── */
.tour-stat-row{border:1px solid var(--border);border-radius:8px;margin-bottom:.6rem;overflow:hidden}
.tour-stat-header{display:flex;align-items:center;justify-content:space-between;padding:.6rem .8rem;background:var(--card2);cursor:pointer;user-select:none}
.tour-stat-header:hover{background:rgba(212,175,55,.06)}
.tour-stat-name{font-size:.82rem;font-weight:800;color:var(--text)}
.tour-stat-pts{font-family:'Bebas Neue';font-size:.95rem;color:var(--gold);letter-spacing:1px}
.tour-stat-chv{font-size:.75rem;color:var(--muted);transition:color .2s}
.tour-stat-body{display:none;padding:.7rem .8rem;background:var(--card)}
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<body>

<!-- ══ HEADER ══ -->
<div class="hdr">
  <div class="hdr-logo">
    <img src="jalala_logo.png" alt="Jalala Zone">
    <span class="hdr-logo-text">JALALA ZONE</span>
  </div>
  <div class="hdr-sub">Efootball Villa Tournament Hub</div>
  <div>
    <span class="hdr-live" id="livebadge">
      <span class="live-dot"></span>
      <span class="sync-spinner"></span>
      <span class="live-text"></span>
    </span>
  </div>
</div>

<!-- ══ TOURNAMENT PILL TABS (active tournaments only) ══ -->
<div class="t-tabs" id="tTabs"></div>

<!-- ══ TOP-LEVEL TAB BAR: Tournaments / Teams / Past Seasons (NEW) ══ -->
<div id="regTabBar">
  <button class="itab active" id="it-tourney" style="color:var(--gold)" onclick="showTourTab()">🏆 Tournaments</button>
  <button class="itab" id="it-reg" onclick="showRegTab()">🏅 Teams</button>
  <button class="itab" id="it-past" onclick="showPastTab()">🏁 Past Seasons</button>
</div>

<!-- ══ INNER TABS (shown when a tournament is open) ══ -->
<div class="itabs" id="iTabs" style="display:none">
  <button class="itab active" id="it-table">📊 Table</button>
  <button class="itab" id="it-results">✅ Results</button>
  <button class="itab" id="it-fixtures">📅 Fixtures</button>
  <button class="itab" id="it-playoffs">🏆 Playoffs</button>
  <button class="itab" id="it-goals">⚽ Goals</button>
  <button class="itab" id="it-teams">👥 Teams</button>
  <button class="itab" id="it-rules">📜 Rules</button>
</div>

<!-- ══ REGISTRY SECTION (NEW) ══ -->
<div id="secRegistry" style="padding:.8rem;display:none"></div>

<!-- ══ PAST SEASONS SECTION (NEW) ══ -->
<div id="secPast" style="padding:.8rem;display:none"></div>

<!-- ══ TOURNAMENT CONTENT WRAPPER ══ -->
<div id="tourContent" style="display:none">
  <div id="secTable"></div>
  <div id="secResults"  style="display:none" class="results-list"></div>
  <div id="secFixtures" style="display:none" class="results-list"></div>
  <div id="secPlayoffs" style="display:none" class="results-list">
    <div id="trophySplash" style="display:none"></div>
    <div id="bracketContent"></div>
  </div>
  <div id="secGoals"   style="display:none" class="results-list"></div>
  <div id="secTeams"   style="display:none;padding:.8rem"></div>
  <div id="secRules"   style="display:none" class="results-list"></div>
</div>

<!-- ══ WINNER TICKERS ══ -->
<div class="winner-ticker ticker-top" id="winnerTickerTop" style="display:none">
  <div class="winner-ticker-inner scroll-a" id="winnerTickerTextTop"></div>
</div>
<div class="winner-ticker ticker-bottom" id="winnerTickerBottom" style="display:none">
  <div class="winner-ticker-inner scroll-b" id="winnerTickerTextBottom"></div>
</div>

<div class="admin-link">⚙️ Admin? <a href="admin.html">Login here</a></div>

<footer style="text-align:center;padding:2rem 1rem;color:var(--muted);font-size:0.75rem;border-top:1px solid var(--border);margin-top:2rem">

</footer>

<script>

// ── App state ──────────────────────────────────────────────────
var db = {tournaments:[]};
var activeTid     = null;
var activeSection = 'table';
var registryTeams = [];   // loaded from Firebase registry/ node (NEW)

// ── normalizeTour — crash-prevention (NEW) ─────────────────────
// Ensures every tournament object has the arrays we expect.
// Prevents "Cannot read property of undefined" when Firebase data
// is partially written.
function normalizeTour(t){
  if(!t) return t;
  if(!Array.isArray(t.teams))    t.teams=[];
  if(!Array.isArray(t.matches))  t.matches=[];
  if(!Array.isArray(t.groups))   t.groups=[];
  if(!Array.isArray(t.playoffs)) t.playoffs=[];
  return t;
}

// ── Sync indicator helpers (NEW) ──────────────────────────────
function syncStart(){
  var b=document.getElementById('livebadge');
  if(b) b.classList.add('syncing');
}
function syncEnd(){
  var b=document.getElementById('livebadge');
  if(b) b.classList.remove('syncing');
}

// ── Storage helpers ────────────────────────────────────────────
function loadFromStorage(){
  try{
    var d=localStorage.getItem('jalala_db');
    if(d){
      db=JSON.parse(d);
      if(Array.isArray(db.tournaments)) db.tournaments.forEach(normalizeTour);
    }
  }catch(e){ db={tournaments:[]}; }
}
function saveToStorage(data){
  try{ localStorage.setItem('jalala_db',JSON.stringify(data)); }catch(e){}
}

// ── Firebase fetch (updated — also loads registry/) ────────────
function fetchFromFirebase(){
  syncStart();

  // Load tournaments
  fbDb.ref('tournaments').once('value').then(function(snap){
    var data=snap.val();
    syncEnd();
    var tours = data ? Object.values(data) : [];
    tours.forEach(normalizeTour);
    db = {tournaments: tours};
    saveToStorage(db);

    renderTournamentTabs();

    var allFinished = tours.length>0 && tours.every(function(t){ return t.status==='finished'; });
    if(allFinished){
      // Every tournament finished — land on Past Seasons
      showPastTab();
    } else if(activeTid){
      // Active tournament open — stay in tournament view
      document.getElementById('secRegistry').style.display='none';
      document.getElementById('secPast').style.display='none';
      document.getElementById('tourContent').style.display='block';
      document.getElementById('it-reg').classList.remove('active');
      document.getElementById('it-past').classList.remove('active');
      document.getElementById('it-tourney').classList.add('active');
      document.getElementById('iTabs').style.display='flex';
      render(activeSection);
    } else {
      // No active tournaments — show registry
      document.getElementById('secRegistry').style.display='block';
      document.getElementById('secPast').style.display='none';
      document.getElementById('tourContent').style.display='none';
      document.getElementById('it-reg').classList.add('active');
      document.getElementById('it-past').classList.remove('active');
      document.getElementById('it-tourney').classList.remove('active');
      renderPublicRegistry();
    }
    updateWinnerTicker();
  }).catch(function(){ syncEnd(); });

  // Load teams registry (NEW)
  fbDb.ref('registry').once('value').then(function(snap){
    var data=snap.val();
    registryTeams = data ? Object.values(data) : [];
    if(document.getElementById('secRegistry').style.display!=='none'){
      renderPublicRegistry();
    }
  }).catch(function(){});
}

// ── Init ───────────────────────────────────────────────────────
function init(){
  activeSection = 'table';
  fetchFromFirebase();
  setInterval(fetchFromFirebase, 30000);
}

// Toggle a registry team card open/closed
function toggleRegCard(safeId, regTeamId){
  var panel=document.getElementById(safeId);

// Build per-tournament stats for a registry team
function buildRegStats(regTeamId){
  var regTeam=registryTeams.find(function(r){ return r.id===regTeamId; });
  if(!regTeam) return '<div class="empty" style="padding:.8rem 0">Team not found</div>';

  var teamName=regTeam.name.trim().toLowerCase();
  // Find all tournaments this team has appeared in (match by name)
  var appearances=db.tournaments.filter(function(t){
    return (t.teams||[]).some(function(tm){ return tm.name.trim().toLowerCase()===teamName; });
  });

  var h='<div>';
  if(!appearances.length){
    h+='<div style="text-align:center;padding:.6rem 0;color:var(--muted);font-size:.8rem">No tournament data yet for this team</div></div>';
    return h;
  }

  h+='<div style="font-size:.7rem;color:var(--muted);margin-bottom:.7rem;letter-spacing:.5px">Appeared in <strong style="color:var(--gold)">'+appearances.length+'</strong> tournament'+(appearances.length>1?'s':'')+'</div>';

  appearances.forEach(function(tour,idx){
    var tourTeam=(tour.teams||[]).find(function(tm){ return tm.name.trim().toLowerCase()===teamName; });
    if(!tourTeam) return;

    var isFinished=tour.status==='finished';
    var rowId='tsr_'+regTeamId.replace(/[^a-zA-Z0-9]/g,'_')+'_'+idx;

    var ranked=sortTeams(tour.teams);
    var pos=ranked.findIndex(function(x){ return x.id===tourTeam.id; })+1;
    var posLabel=pos===1?'1st 🥇':pos===2?'2nd 🥈':pos===3?'3rd 🥉':pos+'th';

    // Last 5 form squares
    var playedM=(tour.matches||[]).filter(function(m){
      return m.done&&(m.homeId===tourTeam.id||m.awayId===tourTeam.id);
    });
    var last5=playedM.slice(-5);
    var formSq='';
    if(last5.length){
      last5.forEach(function(m){
        var isHome=m.homeId===tourTeam.id;
        var gf=isHome?m.homeScore:m.awayScore;
        var ga=isHome?m.awayScore:m.homeScore;
        var res=gf>ga?'W':gf===ga?'D':'L';
        formSq+='<div class="form-sq '+res+'">'+res+'</div>';
      });
    } else {
      formSq='<div class="form-sq none">–</div>'.repeat(5);
    }

    var gd=(tourTeam.goalsFor||0)-(tourTeam.goalsAgainst||0);
    var gdStr=(gd>=0?'+':'')+gd;
    var gdColor=gd>0?'var(--green)':gd<0?'var(--red)':'var(--text)';
    var winRate=(tourTeam.played||0)>0?Math.round(((tourTeam.won||0)/(tourTeam.played||1))*100):0;

    h+='<div class="tour-stat-row">'+
      '<div class="tour-stat-header" onclick="toggleTourStatRow(\''+rowId+'\')">'+
      '<div>'+
      '<div class="tour-stat-name">'+tour.name+(isFinished?' <span style="font-size:.6rem;color:var(--gold);background:rgba(212,175,55,.1);padding:.1rem .3rem;border-radius:3px;letter-spacing:.5px">FINISHED</span>':'')+'</div>'+
      '<div style="font-size:.65rem;color:var(--muted)">'+(tour.season||'')+'</div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:.6rem">'+
      '<span class="tour-stat-pts">'+posLabel+' · '+(tourTeam.points||0)+'pts</span>'+
      '<span class="tour-stat-chv" id="chv_'+rowId+'">▼</span>'+
      '</div>'+
      '</div>'+
      '<div class="tour-stat-body" id="'+rowId+'">'+
      // Stats grid
      '<div class="team-stats-grid" style="border-radius:6px;overflow:hidden;margin-bottom:.7rem">'+
      '<div class="stat-cell"><div class="stat-val">'+(tourTeam.played||0)+'</div><div class="stat-lbl">Played</div></div>'+
      '<div class="stat-cell"><div class="stat-val" style="color:var(--green)">'+(tourTeam.won||0)+'</div><div class="stat-lbl">Won</div></div>'+
      '<div class="stat-cell"><div class="stat-val" style="color:var(--gold)">'+(tourTeam.drawn||0)+'</div><div class="stat-lbl">Drawn</div></div>'+
      '<div class="stat-cell"><div class="stat-val" style="color:var(--red)">'+(tourTeam.lost||0)+'</div><div class="stat-lbl">Lost</div></div>'+
      '<div class="stat-cell"><div class="stat-val">'+(tourTeam.goalsFor||0)+'</div><div class="stat-lbl">GF</div></div>'+
      '<div class="stat-cell"><div class="stat-val">'+(tourTeam.goalsAgainst||0)+'</div><div class="stat-lbl">GA</div></div>'+
      '<div class="stat-cell"><div class="stat-val" style="color:'+gdColor+'">'+gdStr+'</div><div class="stat-lbl">GD</div></div>'+
      '<div class="stat-cell"><div class="stat-val" style="color:var(--gold);font-size:1.5rem">'+(tourTeam.points||0)+'</div><div class="stat-lbl">Pts</div></div>'+
      '</div>'+
      // Form
      '<div class="form-row" style="margin-bottom:.6rem">'+
      '<span class="form-label">Form</span>'+
      '<div class="form-squares">'+formSq+'</div>'+
      '</div>'+
      // Win rate
      '<div class="extra-stats">'+
      '<div class="extra-stat-item"><span class="extra-stat-lbl">Win Rate</span><span class="extra-stat-val">'+winRate+'%</span></div>'+
      '<div class="extra-stat-item"><span class="extra-stat-lbl">Points</span><span class="extra-stat-val" style="color:var(--gold)">'+(tourTeam.points||0)+'</span></div>'+
      '</div>'+
      '</div>'+
      '</div>';
  });

  h+='</div>';
  return h;
}

  var chv=document.getElementById('chv_'+rowId);

  body.style.display=isOpen?'none':'block';
  if(chv){ chv.textContent=isOpen?'▼':'▲'; chv.style.color=isOpen?'':'var(--gold)'; }

// Render the list of finished tournaments
function renderPastList(){
  var el=document.getElementById('secPast');
  var finished=db.tournaments.filter(function(t){ return t.status==='finished'; });
  var h='<div style="font-family:\'Bebas Neue\';font-size:1.3rem;letter-spacing:3px;color:var(--gold);text-align:center;margin-bottom:1rem">🏁 Past Seasons</div>';
  if(!finished.length){
    h+='<div class="empty"><div class="empty-icon">🏁</div>No finished seasons yet</div>';
    el.innerHTML=h; return;
  }
  finished.forEach(function(t){
    var doneCount=(t.matches||[]).filter(function(m){ return m.done; }).length;
    var teamCount=(t.teams||[]).length;
    // Determine winner from bracket final
    var winner='';
    if(t.bracketRounds&&t.bracketRounds.length){
      var finals=t.bracketRounds.filter(function(r){ return r.matches&&r.matches[0]&&!r.matches[0].is3rd; });
      var finalRound=finals[finals.length-1];
      if(finalRound&&finalRound.matches[0]&&finalRound.matches[0].winner)
        winner=finalRound.matches[0].winner.name;
    }
    h+='<div class="past-card" onclick="openPastTour(\''+t.id+'\')">'+
      '<div style="display:flex;align-items:center;justify-content:space-between">'+
      '<div>'+
      '<div class="past-card-name">🏆 '+t.name+'</div>'+
      '<div class="past-card-meta">'+(t.season||'')+(t.season?' · ':'')+teamCount+' teams · '+doneCount+' matches played</div>'+
      (winner?'<div style="font-size:.75rem;color:var(--gold);margin-top:.3rem;font-weight:700">👑 Winner: '+winner+'</div>':'')+
      '</div>'+
      '<div style="font-family:\'Bebas Neue\';font-size:1rem;color:var(--muted);letter-spacing:1px">VIEW →</div>'+
      '</div>'+
      '</div>';
  });
  el.innerHTML=h;
}

// Render a sub-section for a past tournament by temporarily hijacking
// the real render functions (they write to real sec* divs), capturing
// the output, then restoring state. No permanent DOM leakage.
function showPastSec(name,tid){
  ['table','results','fixtures','playoffs','goals','rules'].forEach(function(s){
    var btn=document.getElementById('pt-'+s);
    if(btn) btn.classList.toggle('active',s===name);
  });
  var tour=db.tournaments.find(function(t){ return t.id===tid; });
  if(!tour) return;
  var el=document.getElementById('pastSecContent');
  if(!el) return;

  var prevTid=activeTid;
  activeTid=tid;

  var secIds={
    'table':'secTable','results':'secResults','fixtures':'secFixtures',
    'playoffs':'secPlayoffs','goals':'secGoals','rules':'secRules'
  };
  var secId=secIds[name];
  var realSec=document.getElementById(secId);
  var prevHTML=realSec?realSec.innerHTML:'';

  if(name==='table')    renderTable();
  else if(name==='results')   renderResults();
  else if(name==='fixtures')  renderFixtures();
  else if(name==='playoffs')  renderPlayoffs();
  else if(name==='goals')     renderGoalsRanking();
  else if(name==='rules')     renderRules();

  var rendered=realSec?realSec.innerHTML:'';
  var wrapClass=name==='table'?'':'results-list';
  el.innerHTML=wrapClass?'<div class="'+wrapClass+'">'+rendered+'</div>':rendered;

  if(realSec) realSec.innerHTML=prevHTML;
  activeTid=prevTid;
}

// Renders the top pill tabs — only active (non-finished) tournaments
function renderTournamentTabs(){
  var tabs=document.getElementById('tTabs');
  var allTours=db.tournaments;
  var tours=allTours.filter(function(t){ return t.status!=='finished'; });

  if(!tours||!tours.length){
    tabs.innerHTML='';
    if(activeTid){
      var active=allTours.find(function(t){ return t.id===activeTid; });
      if(!active||active.status==='finished') activeTid=null;
    }
    return;
  }

  // Auto-select first active tour if none set or if current one is finished
  if(!activeTid){
    activeTid=tours[0].id;
  } else {
    var cur=allTours.find(function(t){ return t.id===activeTid; });
    if(!cur||cur.status==='finished') activeTid=tours[0].id;
  }

  tabs.innerHTML=tours.map(function(t){
    return '<button class="t-tab'+(activeTid===t.id?' active':'')+'\" data-tid="'+t.id+'">'+t.name+'</button>';
  }).join('');
  tabs.querySelectorAll('.t-tab').forEach(function(btn){
    btn.addEventListener('click',function(){ openTour(btn.getAttribute('data-tid')); });
  });
}

function openTour(tid){
  activeTid=tid;
  document.getElementById('secRegistry').style.display='none';
  document.getElementById('secPast').style.display='none';
  document.getElementById('tourContent').style.display='block';
  document.getElementById('it-reg').classList.remove('active');
  document.getElementById('it-past').classList.remove('active');
  document.getElementById('it-tourney').classList.add('active');
  document.querySelectorAll('.t-tab').forEach(function(el){
    el.classList.toggle('active',el.getAttribute('data-tid')===tid);
  });
  document.getElementById('iTabs').style.display='flex';
  showSec('table');
}

function showSec(name){
  activeSection=name;
  document.getElementById('tourContent').style.display='block';
  document.getElementById('secRegistry').style.display='none';
  document.getElementById('it-reg').classList.remove('active');
  document.getElementById('it-tourney').classList.add('active');
  ['table','results','fixtures','playoffs','goals','teams','rules'].forEach(function(s){
    var sec=document.getElementById('sec'+cap(s));
    var btn=document.getElementById('it-'+s);
    if(sec) sec.style.display=s===name?'block':'none';
    if(btn) btn.classList.toggle('active',s===name);
  });
  render(name);
}

function cap(s){ return s[0].toUpperCase()+s.slice(1); }
function getTour(){ return db.tournaments.find(function(t){ return t.id===activeTid; }); }

// Wire inner tab buttons
['table','results','fixtures','playoffs','goals','teams','rules'].forEach(function(name){
  var btn=document.getElementById('it-'+name);
  if(btn) btn.addEventListener('click',function(){ showSec(name); });
});

// ── Render dispatcher ──────────────────────────────────────────
function render(name){
  if(name==='table')    renderTable();
  else if(name==='results')   renderResults();
  else if(name==='fixtures')  renderFixtures();
  else if(name==='playoffs')  renderPlayoffs();
  else if(name==='goals')     renderGoalsRanking();
  else if(name==='teams')     renderTeams();
  else if(name==='rules')     renderRules();
}

function sortTeams(teams){
  return teams.slice().sort(function(a,b){
    if(b.points!==a.points) return b.points-a.points;
    var gdA=a.goalsFor-a.goalsAgainst, gdB=b.goalsFor-b.goalsAgainst;
    if(gdB!==gdA) return gdB-gdA;
    return b.goalsFor-a.goalsFor;
  });
}

function renderTable(){
  var el=document.getElementById('secTable');
  var tour=getTour(); if(!tour){el.innerHTML='<div class="empty">No tournament selected</div>';return;}
  normalizeTour(tour);
  var isGroup=tour.format==='groups'&&(tour.groups||[]).length;
  // Admin stores leagueAdv (league) or groupAdv (groups) — not qualifyingSpots
  var spots=tour.leagueAdv||tour.qualifyingSpots||2;

  if(isGroup){
    var h='';
    (tour.groups||[]).forEach(function(g){
      var ranked=sortTeams(g.teams||[]);
      h+='<div class="grp-title">'+g.name+'</div>'+
        '<div class="tbl-outer">'+buildTable(ranked,spots,g.teams.length)+'</div>';
    });
    h+=buildLegend(tour);
    el.innerHTML=h;
  } else {
    var ranked=sortTeams(tour.teams||[]);
    var h='<div class="tbl-outer">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.5rem">'+
      '<div><div class="tbl-name">'+tour.name+'</div>'+
      '<div class="tbl-sub">'+(tour.season||'')+'</div></div>'+
      '</div>'+
      buildTable(ranked,spots,tour.teams.length)+'</div>'+
      buildLegend(tour);
    el.innerHTML=h;
  }
}

function buildTable(ranked,spots,total){
  var e=total||ranked.length;
  var qCount=parseInt(spots)||2;
  var h='<div class="tbl-wrap"><table>'+
    '<thead><tr>'+
    '<th>#</th><th>Team</th>'+
    '<th class="num">P</th><th class="num">W</th><th class="num">D</th><th class="num">L</th>'+
    '<th class="num">GF</th><th class="num">GA</th><th class="num">GD</th>'+
    '<th class="num" style="color:var(--gold)">Pts</th>'+
    '</tr></thead><tbody>';
  ranked.forEach(function(t,i){
    var pos=i+1;
    var gd=(t.goalsFor||0)-(t.goalsAgainst||0);
    var gdStr=(gd>=0?'+':'')+gd;
    var gdColor=gd>0?'var(--green)':gd<0?'var(--red)':'var(--text)';
    var zClass=pos<=qCount?'z-q':(pos===e?'z-e':'');
    h+='<tr class="'+zClass+'">'+
      '<td class="num" style="color:var(--muted);font-size:.75rem">'+pos+'</td>'+
      '<td style="font-weight:800;max-width:120px;overflow:hidden;text-overflow:ellipsis">'+t.name+'</td>'+
      '<td class="num">'+(t.played||0)+'</td>'+
      '<td class="num" style="color:var(--green)">'+(t.won||0)+'</td>'+
      '<td class="num" style="color:var(--muted)">'+(t.drawn||0)+'</td>'+
      '<td class="num" style="color:var(--red)">'+(t.lost||0)+'</td>'+
      '<td class="num">'+(t.goalsFor||0)+'</td>'+
      '<td class="num">'+(t.goalsAgainst||0)+'</td>'+
      '<td class="num" style="color:'+gdColor+';font-weight:700">'+gdStr+'</td>'+
      '<td class="num pts-cell">'+(t.points||0)+'</td>'+
      '</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

function buildLegend(tour){
  var spots=parseInt(tour.leagueAdv||tour.groupAdv||tour.qualifyingSpots)||2;
  var h='<div class="z-legend">';
  if(spots>0) h+='<div class="zl"><div class="zl-dot" style="background:var(--green)"></div>Qualify for Playoffs</div>';
  h+='<div class="zl"><div class="zl-dot" style="background:var(--red)"></div>Elimination Zone</div>';
  h+='</div>';
  return h;
}

// ══════════════════════════════════════════════════════════════
//  RENDER — RESULTS  (card style — NEW)
// ══════════════════════════════════════════════════════════════
function renderResults(){
  var el=document.getElementById('secResults');
  var tour=getTour(); if(!tour){el.innerHTML='';return;}
  normalizeTour(tour);
  var done=(tour.matches||[]).filter(function(m){return m.done;});
  if(!done.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">✅</div>No results yet</div>';
    return;
  }

  // Group by round
  var byRound={};
  done.forEach(function(m){
    var k=m.round||'Round 1';
    if(!byRound[k]) byRound[k]=[];
    byRound[k].push(m);
  });

  var h='';
  Object.keys(byRound).sort(function(a,b){
    var na=parseInt(a.replace(/\D/g,''))||0;
    var nb=parseInt(b.replace(/\D/g,''))||0;
    return nb-na; // most recent first
  }).forEach(function(rnd){
    var matches=byRound[rnd];
    var rndId='r_'+rnd.replace(/\s/g,'_');
    h+='<div style="margin-bottom:.3rem">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem .8rem;background:var(--card2);border-radius:8px;cursor:pointer;margin-bottom:.4rem" onclick="toggleRndBlock(\''+rndId+'\')">'+
      '<span style="font-family:\'Bebas Neue\';font-size:.95rem;color:var(--gold);letter-spacing:1.5px">'+rnd+'</span>'+
      '<span style="font-size:.7rem;color:var(--muted)">'+matches.length+' match'+(matches.length>1?'es':'')+'</span>'+
      '</div>'+
      '<div id="'+rndId+'">';

    matches.forEach(function(m){
      var ht=getTeam(tour,m.homeId)||{name:m.homeName||'?'};
      var at=getTeam(tour,m.awayId)||{name:m.awayName||'?'};
      var hWin=m.homeScore>m.awayScore, aWin=m.awayScore>m.homeScore;
      var hCoach=getCoach(tour,m.homeId);
      var aCoach=getCoach(tour,m.awayId);
      h+='<div class="r-item">'+
        '<div class="r-matchup">'+
        '<div class="r-home-side">'+
        '<div class="r-tname" style="'+(hWin?'color:var(--green)':'')+'">'+ht.name+'</div>'+
        (hCoach?'<div class="r-tcoach">'+hCoach+'</div>':'')+
        '</div>'+
        '<div class="r-score-badge">'+
        '<div class="r-score">'+m.homeScore+' – '+m.awayScore+'</div>'+
        '<div class="r-meta">FT</div>'+
        '</div>'+
        '<div class="r-away-side">'+
        '<div class="r-tname" style="'+(aWin?'color:var(--green)':'')+'">'+at.name+'</div>'+
        (aCoach?'<div class="r-tcoach">'+aCoach+'</div>':'')+
        '</div>'+
        '</div>'+
        '</div>';
    });

    h+='</div></div>';
  });

  el.innerHTML=h;
}

function toggleRndBlock(id){
  var el=document.getElementById(id);
  if(el) el.style.display=el.style.display==='none'?'block':'none';
}

// ══════════════════════════════════════════════════════════════
//  RENDER — FIXTURES  (card style — NEW)
// ══════════════════════════════════════════════════════════════
function renderFixtures(){
  var el=document.getElementById('secFixtures');
  var tour=getTour(); if(!tour){el.innerHTML='';return;}
  normalizeTour(tour);
  var pending=(tour.matches||[]).filter(function(m){return !m.done;});
  if(!pending.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">📅</div>No upcoming fixtures</div>';
    return;
  }
  var byRound={};
  pending.forEach(function(m){
    var k=m.round||'Round 1';
    if(!byRound[k]) byRound[k]=[];
    byRound[k].push(m);
  });

  var h='';
  Object.keys(byRound).sort(function(a,b){
    var na=parseInt(a.replace(/\D/g,''))||0;
    var nb=parseInt(b.replace(/\D/g,''))||0;
    return na-nb;
  }).forEach(function(rnd){
    var matches=byRound[rnd];
    var rndId='fx_'+rnd.replace(/\s/g,'_');
    h+='<div style="margin-bottom:.3rem">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem .8rem;background:var(--card2);border-radius:8px;cursor:pointer;margin-bottom:.4rem" onclick="toggleRndBlock(\''+rndId+'\')">'+
      '<span style="font-family:\'Bebas Neue\';font-size:.95rem;color:var(--gold);letter-spacing:1.5px">'+rnd+'</span>'+
      '<span style="font-size:.7rem;color:var(--muted)">'+matches.length+' match'+(matches.length>1?'es':'')+'</span>'+
      '</div>'+
      '<div id="'+rndId+'">';
    matches.forEach(function(m){
      h+=buildFixCard(tour,m,rnd);
    });
    h+='</div></div>';
  });

  el.innerHTML=h;
}

// Build a single fixture card (NEW helper)
function buildFixCard(tour,m,rnd){
  var ht=getTeam(tour,m.homeId)||{name:m.homeName||'?'};
  var at=getTeam(tour,m.awayId)||{name:m.awayName||'?'};
  var hCoach=getCoach(tour,m.homeId);
  var aCoach=getCoach(tour,m.awayId);
  return '<div class="fix-item">'+
    '<div class="fix-header">'+
    '<div class="fix-team-side fix-home">'+
    '<span class="fix-team-name">'+ht.name+'</span>'+
    (hCoach?'<span class="fix-team-coach">'+hCoach+'</span>':'')+
    '</div>'+
    '<div class="fix-vs-badge">VS</div>'+
    '<div class="fix-team-side fix-away">'+
    '<span class="fix-team-name">'+at.name+'</span>'+
    (aCoach?'<span class="fix-team-coach">'+aCoach+'</span>':'')+
    '</div>'+
    '</div>'+
    '<div class="fix-footer">'+
    '<span class="fix-date">'+(m.scheduledDate||'TBD')+'</span>'+
    '<span class="fix-round-label">'+rnd+'</span>'+
    '</div>'+
    '</div>';
}

// Helper: get team by id
function getTeam(tour,id){
  // league teams
  var t=(tour.teams||[]).find(function(x){return x.id===id;});
  if(t) return t;
  // group teams
  if(tour.groups) for(var g=0;g<tour.groups.length;g++){
    var found=(tour.groups[g].teams||[]).find(function(x){return x.id===id;});
    if(found) return found;
  }
  return null;
}

// Helper: get coach name from registry or team object (NEW)
function getCoach(tour,teamId){
  var t=getTeam(tour,teamId);
  if(!t) return '';
  // Try registry first for most up-to-date coach
  var regEntry=registryTeams.find(function(r){
    return r.name&&t.name&&r.name.trim().toLowerCase()===t.name.trim().toLowerCase();
  });
  if(regEntry&&regEntry.coach) return '🧢 '+regEntry.coach;
  if(t.coach) return '🧢 '+t.coach;
  return '';
}

// ══════════════════════════════════════════════════════════════
//  RENDER — PLAYOFFS
// ══════════════════════════════════════════════════════════════
function renderPlayoffs(){
  var tour=getTour(); if(!tour) return;
  normalizeTour(tour);
  var splash=document.getElementById('trophySplash');
  var bracket=document.getElementById('bracketContent');
  if(!splash||!bracket) return;

  var rounds=tour.bracketRounds||[];
  if(!rounds.length){
    splash.style.display='none';
    bracket.innerHTML='<div class="empty"><div class="empty-icon">🏆</div>Playoffs not started yet</div>';
    return;
  }

  var allDone=rounds.every(function(r){
    return (r.matches||[]).every(function(m){return m.done;});
  });

  if(allDone){
    var finalRound=rounds.filter(function(r){
      return r.matches&&r.matches[0]&&!r.matches[0].is3rd;
    });
    var lastRound=finalRound[finalRound.length-1];
    var champion=lastRound&&lastRound.matches[0]&&lastRound.matches[0].winner;
    if(champion){
      splash.style.display='block';
      splash.innerHTML='<div style="text-align:center;padding:2rem 1rem">'+
        '<div style="font-size:4rem;animation:trophyGlow 1.5s ease-in-out infinite alternate">🏆</div>'+
        '<div style="font-family:\'Bebas Neue\';font-size:2.2rem;color:var(--gold);letter-spacing:4px;margin-top:.5rem">CHAMPION</div>'+
        '<div style="font-family:\'Bebas Neue\';font-size:1.6rem;color:#fff;letter-spacing:2px">'+champion.name+'</div>'+
        '</div>';
    } else { splash.style.display='none'; }
  } else { splash.style.display='none'; }

  var h='';
  rounds.forEach(function(r){
    h+='<div style="font-family:\'Bebas Neue\';font-size:1rem;letter-spacing:2px;color:var(--gold);margin:.7rem .2rem .3rem">'+r.name+'</div>';
    (r.matches||[]).forEach(function(m){
      if(!m.t1||!m.t2) return;
      var hWin=m.winner&&m.winner.id===m.t1.id;
      var aWin=m.winner&&m.winner.id===m.t2.id;
      // Build score string
      var scoreStr='';
      if(m.legs===2&&m.leg1h!=null&&m.leg2h!=null){
        var agg1=(m.leg1h||0)+(m.leg2a||0)+(m.et1h||0)+(m.et2a||0);
        var agg2=(m.leg1a||0)+(m.leg2h||0)+(m.et1a||0)+(m.et2h||0);
        scoreStr=agg1+' – '+agg2+(m.pk2h!=null?' (PK '+m.pk2h+'–'+m.pk2a+')':'');
      } else if(m.leg1h!=null&&m.leg1a!=null){
        scoreStr=m.leg1h+' – '+m.leg1a+(m.pk1h!=null?' (PK '+m.pk1h+'–'+m.pk1a+')':'');
      }
      h+='<div class="po-item">'+
        '<div style="display:flex;align-items:center;gap:.5rem">'+
        '<div style="flex:1;min-width:0">'+
        '<div class="po-teams" style="'+(hWin?'color:var(--green)':'')+'">'+m.t1.name+'</div>'+
        '<div class="po-meta">'+(m.t1.coach||'')+'</div>'+
        '</div>'+
        '<div class="po-score">'+(scoreStr||'vs')+'</div>'+
        '<div style="flex:1;min-width:0;text-align:right">'+
        '<div class="po-teams" style="'+(aWin?'color:var(--green)':'')+'">'+m.t2.name+'</div>'+
        '<div class="po-meta" style="text-align:right">'+(m.t2.coach||'')+'</div>'+
        '</div>'+
        '</div>'+
        (m.winner?'<div class="po-winner">✅ '+m.winner.name+' advances</div>':
        (m.is3rd?'<div class="po-winner" style="color:var(--gold)">3rd Place Match</div>':''))+
        '</div>';
    });
  });
  bracket.innerHTML=h;
}

// ══════════════════════════════════════════════════════════════
//  RENDER — GOALS RANKING
// ══════════════════════════════════════════════════════════════
function renderGoalsRanking(){
  var el=document.getElementById('secGoals');
  var tour=getTour(); if(!tour){el.innerHTML='';return;}
  var sorted=sortTeams(tour.teams||[]).filter(function(t){return (t.goalsFor||0)>0;});
  if(!sorted.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">⚽</div>No goals scored yet</div>';
    return;
  }
  var max=sorted[0].goalsFor||1;
  var h='<div style="font-family:\'Bebas Neue\';font-size:1.1rem;letter-spacing:2px;color:var(--gold);margin-bottom:.8rem">Top Scoring Teams</div>';
  sorted.forEach(function(t,i){
    var pct=Math.round(((t.goalsFor||0)/max)*100);
    var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':''+(i+1)+'.';
    h+='<div style="margin-bottom:.7rem">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.2rem">'+
      '<div style="display:flex;align-items:center;gap:.5rem">'+
      '<span style="font-size:'+(i<3?'1.1rem':'.85rem')+'">'+medal+'</span>'+
      '<span style="font-weight:800;font-size:.9rem">'+t.name+'</span>'+
      '</div>'+
      '<span style="font-family:\'Bebas Neue\';font-size:1.1rem;color:var(--gold)">'+t.goalsFor+' <span style="font-size:.7rem;color:var(--muted)">GF</span></span>'+
      '</div>'+
      '<div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden">'+
      '<div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .6s ease"></div>'+
      '</div>'+
      '</div>';
  });
  el.innerHTML=h;
}

//  RENDER — TEAMS (in-tournament, NEW)
// ══════════════════════════════════════════════════════════════
function renderTeams(){
  var el=document.getElementById('secTeams');
  var tour=getTour(); if(!tour){el.innerHTML='';return;}
  normalizeTour(tour);
  var teams=tour.teams||[];
  if(!teams.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">👥</div>No teams yet</div>';
    return;
  }
  var ranked=sortTeams(teams);
  var opts=ranked.map(function(t,i){
    return '<option value="'+t.id+'">'+(i+1)+'. '+t.name+'</option>';
  }).join('');

  el.innerHTML=
    '<div class="team-select-wrap">'+
    '<label>Select a team to view stats</label>'+
    '<select class="team-dropdown" id="teamPickerDropdown" onchange="renderTeamCard(this.value)">'+
    opts+
    '</select>'+
    '</div>'+
    '<div id="teamCardArea"></div>';

  // Auto-render first team
  if(ranked.length) renderTeamCard(ranked[0].id);
}

function renderTeamCard(teamId){
  var el=document.getElementById('teamCardArea');
  var tour=getTour(); if(!tour||!el) return;
  normalizeTour(tour);
  var teams=tour.teams||[];
  var ranked=sortTeams(teams);
  var t=teams.find(function(x){return x.id===teamId;});
  if(!t){el.innerHTML='';return;}
  var pos=ranked.findIndex(function(x){return x.id===teamId;})+1;
  var posLabel=pos===1?'1st 🥇':pos===2?'2nd 🥈':pos===3?'3rd 🥉':pos+'th';

  // Last 5 matches form
  var playedM=(tour.matches||[]).filter(function(m){
    return m.done&&(m.homeId===t.id||m.awayId===t.id);
  });
  var last5=playedM.slice(-5);
  var formSq='';
  if(last5.length){
    last5.forEach(function(m){
      var isHome=m.homeId===t.id;
      var gf=isHome?m.homeScore:m.awayScore;
      var ga=isHome?m.awayScore:m.homeScore;
      var r=gf>ga?'W':gf===ga?'D':'L';
      formSq+='<div class="form-sq '+r+'">'+r+'</div>';
    });
  } else {
    formSq='<div class="form-sq none">–</div>'.repeat(5);
  }

  var gd=(t.goalsFor||0)-(t.goalsAgainst||0);
  var gdStr=(gd>=0?'+':'')+gd;
  var gdColor=gd>0?'var(--green)':gd<0?'var(--red)':'var(--text)';
  var winRate=(t.played||0)>0?Math.round(((t.won||0)/(t.played||1))*100):0;
  var coach=getCoach(tour,teamId);

  var h='<div class="team-card">'+
    '<div class="team-card-header">'+
    '<div class="team-card-avatar">⚽</div>'+
    '<div class="team-card-title">'+
    '<div class="team-card-name">'+t.name+'</div>'+
    (coach?'<div class="team-card-coach">'+coach+'</div>':'')+
    '</div>'+
    '<div class="team-card-pos">'+posLabel+'</div>'+
    '</div>'+
    '<div class="team-stats-grid">'+
    '<div class="stat-cell"><div class="stat-val">'+(t.played||0)+'</div><div class="stat-lbl">Played</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:var(--green)">'+(t.won||0)+'</div><div class="stat-lbl">Won</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:var(--gold)">'+(t.drawn||0)+'</div><div class="stat-lbl">Drawn</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:var(--red)">'+(t.lost||0)+'</div><div class="stat-lbl">Lost</div></div>'+
    '<div class="stat-cell"><div class="stat-val">'+(t.goalsFor||0)+'</div><div class="stat-lbl">GF</div></div>'+
    '<div class="stat-cell"><div class="stat-val">'+(t.goalsAgainst||0)+'</div><div class="stat-lbl">GA</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:'+gdColor+'">'+gdStr+'</div><div class="stat-lbl">GD</div></div>'+
    '<div class="stat-cell"><div class="stat-val" style="color:var(--gold);font-size:1.5rem">'+(t.points||0)+'</div><div class="stat-lbl">Pts</div></div>'+
    '</div>'+
    '<div class="team-card-body">'+
    '<div class="form-row">'+
    '<span class="form-label">Last 5</span>'+
    '<div class="form-squares">'+formSq+'</div>'+
    '</div>'+
    '<div class="extra-stats">'+
    '<div class="extra-stat-item"><span class="extra-stat-lbl">Win Rate</span><span class="extra-stat-val">'+winRate+'%</span></div>'+
    '<div class="extra-stat-item"><span class="extra-stat-lbl">Clean Sheets</span><span class="extra-stat-val">'+(t.cleanSheets||0)+'</span></div>'+
    '<div class="extra-stat-item"><span class="extra-stat-lbl">Goals/Game</span><span class="extra-stat-val">'+((t.played&&t.played>0)?((t.goalsFor||0)/t.played).toFixed(1):'0.0')+'</span></div>'+
    '<div class="extra-stat-item"><span class="extra-stat-lbl">Position</span><span class="extra-stat-val" style="color:var(--gold)">'+posLabel+'</span></div>'+
    '</div>'+
    '</div>'+
    '</div>';

  el.innerHTML=h;
}

// ══════════════════════════════════════════════════════════════
//  WINNER TICKER
// ══════════════════════════════════════════════════════════════
function updateWinnerTicker(){
  var top=document.getElementById('winnerTickerTop');
  var bot=document.getElementById('winnerTickerBottom');
  var txtTop=document.getElementById('winnerTickerTextTop');
  var txtBot=document.getElementById('winnerTickerTextBottom');

  var finishedTours=db.tournaments.filter(function(t){return t.status==='finished';});
  var msgs=[];
  finishedTours.forEach(function(tour){
    var rounds=tour.bracketRounds||[];
    if(!rounds.length) return;
    var final=rounds.filter(function(r){return r.matches&&r.matches[0]&&!r.matches[0].is3rd;});
    var last=final[final.length-1];
    if(last&&last.matches[0]&&last.matches[0].winner){
      msgs.push('🏆 '+tour.name+' Champion: '+last.matches[0].winner.name+' ');
    }
  });

  if(!msgs.length){
    if(top) top.style.display='none';
    if(bot) bot.style.display='none';
    document.body.style.paddingTop='';
    document.body.style.paddingBottom='3rem';
    return;
  }

  var txt=msgs.join(' ✦ ')+'✦';
  if(txtTop) txtTop.textContent=txt;
  if(txtBot) txtBot.textContent=txt;
  if(top) top.style.display='flex';
  if(bot) bot.style.display='flex';
  document.body.style.paddingTop='2.2rem';
  document.body.style.paddingBottom='5.4rem';
}
