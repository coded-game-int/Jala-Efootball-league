<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JALALA Zone – Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4af37;--gold2:#f0cf6a;--dark:#0b0b14;--card:#13131f;--border:#2a2a40;--green:#06ffa5;--red:#ff3355;--muted:#777;--text:#f0f0f0}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.wrap{width:100%;max-width:420px}
.logo-bar{text-align:center;margin-bottom:2rem}
.logo-bar h1{font-family:'Bebas Neue';font-size:2.8rem;color:var(--gold);letter-spacing:4px;line-height:1}
.logo-bar p{color:var(--muted);font-size:.8rem;letter-spacing:2px;margin-top:.3rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:2rem}
.card h2{font-family:'Bebas Neue';font-size:1.4rem;letter-spacing:2px;color:var(--gold);margin-bottom:1.5rem;text-align:center}
label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:.4rem}
input{width:100%;background:#0d0d1a;border:1.5px solid var(--border);color:var(--text);padding:.85rem 1rem;border-radius:8px;font-family:'Barlow';font-size:1rem;margin-bottom:1.2rem;transition:border-color .2s}
input:focus{outline:none;border-color:var(--gold)}
.pw-wrap{position:relative;margin-bottom:1.2rem}
.pw-wrap input{margin-bottom:0}
.pw-toggle{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0;line-height:1}
.pw-toggle:hover{color:var(--gold)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blinking{animation:blink .7s infinite}
.btn{width:100%;padding:.9rem;border:none;border-radius:8px;font-family:'Barlow';font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:1.5px;cursor:pointer;background:var(--gold);color:#000;transition:all .2s}
.btn:hover{background:var(--gold2);transform:translateY(-1px)}
.err{background:rgba(255,51,85,.12);border-left:3px solid var(--red);color:var(--red);padding:.7rem 1rem;border-radius:6px;margin-bottom:1rem;font-size:.85rem;display:none}
.err.show{display:block}
.hint{text-align:center;color:var(--muted);font-size:.78rem;margin-top:1.2rem}
.hint strong{color:var(--gold)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-bar">
    <h1>⚽ JALALA</h1>
    <p>EFOOTBALL VILLA ZONE · ADMIN</p>
  </div>
  <div class="card">
    <h2>Admin Login</h2>
    <div id="err" class="err"></div>
    <label>Email</label>
    <input type="email" id="em" placeholder="Enter email" autofocus onkeydown="if(event.key==='Enter')window.login&&window.login()">
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" id="pw" placeholder="Enter password" onkeydown="if(event.key==='Enter')window.login&&window.login()">
      <button class="pw-toggle" onclick="togglePw()" tabindex="-1" id="pwToggle">👁</button>
    </div>
    <button class="btn" id="loginBtn" onclick="window.login&&window.login()">LOGIN</button>
    <p style="text-align:center;margin-top:1rem">
      <a href="#" onclick="window.forgotPassword&&window.forgotPassword()" style="color:var(--muted);font-size:.78rem;text-decoration:none;letter-spacing:.5px">Forgot password?</a>
    </p>
    <p style="text-align:center;margin-top:.7rem">
      <a href="index.html" style="color:var(--muted);font-size:.75rem;text-decoration:none;opacity:.7">← Back to public site</a>
    </p>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCYHVDq8D492xais1q06ra4GtzNawpsNEA",
  authDomain: "jalala-zone.firebaseapp.com",
  projectId: "jalala-zone",
  storageBucket: "jalala-zone.firebasestorage.app",
  messagingSenderId: "1017844260648",
  appId: "1:1017844260648:web:6273826b83aa86fe37fa1d",
  databaseURL: "https://jalala-zone-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// If already logged in, go straight to dashboard
onAuthStateChanged(auth, user => {
  if(user) location.href='admin_dashboard.html';
});

// Attach button listeners directly — more reliable than window globals
document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('em').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
document.querySelector('a[href="#"]').addEventListener('click', e=>{ e.preventDefault(); forgotPassword(); });

async function login(){
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('loginBtn');
  err.classList.remove('show');
  if(!em || !pw){ err.textContent='Please enter email and password.'; err.classList.add('show'); return; }
  btn.textContent='🔐 Logging in...'; btn.classList.add('blinking'); btn.disabled=true;

  // Timeout after 10 seconds — prevents frozen feeling
  const timeout = setTimeout(()=>{
    btn.textContent='LOGIN'; btn.classList.remove('blinking'); btn.disabled=false;
    err.textContent='Connection timed out. Check your internet and try again.';
    err.classList.add('show');
  }, 10000);

  try {
    await signInWithEmailAndPassword(auth, em, pw);
    clearTimeout(timeout);
    // onAuthStateChanged will redirect
  } catch(e) {
    clearTimeout(timeout);
    btn.textContent='LOGIN'; btn.classList.remove('blinking'); btn.disabled=false;
    err.textContent='Wrong email or password. Try again.';
    err.classList.add('show');
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}

function togglePw(){
  const input=document.getElementById('pw');
  const btn=document.getElementById('pwToggle');
  if(input.type==='password'){input.type='text';btn.textContent='🙈';}
  else{input.type='password';btn.textContent='👁';}
}
window.togglePw=togglePw;

async function forgotPassword(){
  const em = document.getElementById('em').value.trim();
  const err = document.getElementById('err');
  err.style.background=''; err.style.borderColor=''; err.style.color='';
  if(!em){ err.textContent='Enter your email above first, then click Forgot password.'; err.classList.add('show'); return; }
  try {
    await sendPasswordResetEmail(auth, em);
    err.style.background='rgba(6,255,165,.1)';
    err.style.borderColor='var(--green)';
    err.style.color='var(--green)';
    err.textContent='✅ Reset email sent! Check your inbox.';
    err.classList.add('show');
  } catch(e) {
    err.textContent='Could not send reset email. Check the address and try again.';
    err.classList.add('show');
  }
}
</script>
</body>
</html>
