<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFL Zone – Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;700;800&display=swap&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#d4af37;--gold2:#f0cf6a;--dark:#07070f;--card:#0f0f1c;--border:#1e1e35;--green:#06ffa5;--red:#ff3355;--muted:#666;--text:#f0f0f0}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative}

body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(212,175,55,.07) 0%,transparent 60%);pointer-events:none;z-index:0}

.wrap{width:100%;max-width:400px;position:relative;z-index:1}

.logo-bar{text-align:center;margin-bottom:2rem}
.logo-bar img{width:80px;height:80px;border-radius:50%;border:2.5px solid rgba(212,175,55,.5);box-shadow:0 0 30px rgba(212,175,55,.2);object-fit:cover;margin-bottom:.8rem}
.logo-bar h1{font-family:'Bebas Neue';font-size:2.4rem;color:var(--gold);letter-spacing:6px;line-height:1}
.logo-bar p{color:var(--muted);font-size:.72rem;letter-spacing:3px;margin-top:.35rem;text-transform:uppercase}

.card{background:#0d0d1c;border:1px solid var(--border);border-radius:18px;padding:2rem 1.8rem;box-shadow:0 20px 50px rgba(0,0,0,.5);position:relative}
.card h2{font-family:'Bebas Neue';font-size:1.3rem;letter-spacing:3px;color:var(--gold);margin-bottom:1.6rem;text-align:center;opacity:.9}

.divider{display:flex;align-items:center;gap:.8rem;margin-bottom:1.6rem}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}
.divider span{font-size:.6rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase}

label{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.4rem}
.input-wrap{position:relative;margin-bottom:1.2rem}
input{width:100%;background:rgba(255,255,255,.03);border:1.5px solid var(--border);color:var(--text);padding:.9rem 1rem;border-radius:10px;font-family:'Barlow';font-size:.95rem;transition:border-color .2s}
input:focus{outline:none;border-color:var(--gold);background:rgba(212,175,55,.03)}
input::placeholder{color:var(--muted);opacity:.7}

.pw-wrap{position:relative;margin-bottom:1.2rem}
.pw-wrap input{padding-right:3rem;margin-bottom:0}
.pw-toggle{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0;line-height:1}
.pw-toggle:hover{color:var(--gold)}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.blinking{animation:blink .7s infinite}

.btn{width:100%;padding:1rem;border:none;border-radius:10px;font-family:'Bebas Neue';font-size:1.1rem;text-transform:uppercase;letter-spacing:3px;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;transition:transform .15s,box-shadow .15s;margin-top:.4rem}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(212,175,55,.3)}
.btn:active{transform:translateY(0)}

.err{background:rgba(255,51,85,.08);border:1px solid rgba(255,51,85,.3);color:var(--red);padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.83rem;display:none}
.err.show{display:block}

.footer-links{text-align:center;margin-top:1.4rem;display:flex;flex-direction:column;gap:.5rem}
.footer-links a{color:var(--muted);font-size:.75rem;text-decoration:none;letter-spacing:.5px}
.footer-links a:hover{color:var(--gold)}

.card-top-line{position:absolute;top:0;left:10%;right:10%;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:50%}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-bar">
    <img src="jalala_logo.png" alt="PFL">
    <h1>PFL</h1>
    <p>Prime eFootball League · Admin</p>
  </div>
  <div class="card">
    <div class="card-top-line"></div>
    <div class="divider"><div class="divider-line"></div><span>Admin Login</span><div class="divider-line"></div></div>
    <div id="err" class="err"></div>
    <label>Email</label>
    <div class="input-wrap">
      <input type="email" id="em" placeholder="Enter your email" autofocus onkeydown="if(event.key==='Enter')window.login&&window.login()">
    </div>
    <label>Password</label>
    <div class="pw-wrap">
      <input type="password" id="pw" placeholder="Enter your password" onkeydown="if(event.key==='Enter')window.login&&window.login()">
      <button class="pw-toggle" onclick="togglePw()" tabindex="-1" id="pwToggle">👁</button>
    </div>
    <button class="btn" id="loginBtn" onclick="window.login&&window.login()">LOGIN</button>
    <div class="footer-links">
      <a href="#" onclick="window.forgotPassword&&window.forgotPassword();return false">Forgot password?</a>
      <a href="index.html">← Back to public site</a>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-aPVuy1q8VBT7Utbn374EdQM3CpCrY0I",
  authDomain: "prime-efootball-league-pfl.firebaseapp.com",
  projectId: "prime-efootball-league-pfl",
  storageBucket: "prime-efootball-league-pfl.firebasestorage.app",
  messagingSenderId: "787228989452",
  appId: "1:787228989452:web:a17b11c16fff7c58c0b629",
  databaseURL: "https://prime-efootball-league-pfl-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, user => { if(user) location.href='admin_dashboard.html'; });

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('em').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
document.querySelector('a[href="#"]').addEventListener('click', e=>{ e.preventDefault(); forgotPassword(); });

async function login(){
  const em = document.getElementById('em').value.trim();
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('loginBtn');
  err.classList.remove('show');
  if(!em || !pw){ err.textContent='Please enter email and password.'; err.classList.add('show'); return; }
  btn.textContent='Logging in...'; btn.classList.add('blinking'); btn.disabled=true;
  const timeout = setTimeout(()=>{
    btn.textContent='LOGIN'; btn.classList.remove('blinking'); btn.disabled=false;
    err.textContent='Connection timed out. Check your internet and try again.';
    err.classList.add('show');
  }, 10000);
  try {
    await signInWithEmailAndPassword(auth, em, pw);
    clearTimeout(timeout);
  } catch(e) {
    clearTimeout(timeout);
    btn.textContent='LOGIN'; btn.classList.remove('blinking'); btn.disabled=false;
    err.textContent='Wrong email or password. Try again.';
    err.classList.add('show');
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
  }
}

function togglePw(){
  const input=document.getElementById('pw');
  const btn=document.getElementById('pwToggle');
  if(input.type==='password'){input.type='text';btn.textContent='🙈';}
  else{input.type='password';btn.textContent='👁';}
}
window.togglePw=togglePw;
window.login=login;

async function forgotPassword(){
  const em = document.getElementById('em').value.trim();
  const err = document.getElementById('err');
  err.style.background=''; err.style.borderColor=''; err.style.color='';
  if(!em){ err.textContent='Enter your email above first, then click Forgot password.'; err.classList.add('show'); return; }
  try {
    await sendPasswordResetEmail(auth, em);
    err.style.background='rgba(6,255,165,.08)';
    err.style.borderColor='rgba(6,255,165,.3)';
    err.style.color='var(--green)';
    err.textContent='✅ Reset email sent! Check your inbox.';
    err.classList.add('show');
  } catch(e) {
    err.textContent='Could not send reset email. Check the address and try again.';
    err.classList.add('show');
  }
}
window.forgotPassword=forgotPassword;
</script>
</body>
</html>
